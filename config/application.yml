nacos:
  server-addr: host.docker.internal:8848
  namespace: "" # public；其他命名空间填 ID
  group: DEFAULT_GROUP
  data-id: ai-center-agent-service
  username: ""
  password: ""
runtime:
  observability:
    enabled: false # 总开关；开启后保留所有会话的脱敏待采事件，供独立平台拉取。
    storage: .scribe-runs/observation.sqlite # 有界待采日志，相对项目根目录。
    max-records: 20000
    retention-seconds: 86400
    queue-size: 2048
  timeouts: # 毫秒；按职责分别计时，执行预算从附件准备完成后开始。
    execution-ms: 3600000
    client-queue-ms: 300000
    client-idle-ms: 300000
    file-prepare-ms: 600000
    file-broker-ms: 15000
    file-upload-connect-ms: 10000
    worker-start-ms: 60000
    worker-send-ms: 5000
    worker-close-ms: 5000
    worker-control-ms: 5000
    document-render-ms: 180000
    document-start-ms: 30000
    image-ms: 600000
    web-search-ms: 90000
    mcp-http-ms: 30000
    nacos-ms: 10000
    nacos-request-ms: 5000
  limits:
    max-turns: 30
    file-max-bytes: 268435456
    sdk-buffer-bytes: 16777216
    http-body-bytes: 2097152
    prompt-bytes: 32768
  sse-heartbeat-ms: 15000
  models:
    default: deepseek-v4.1-flash
    available:
      - deepseek-v4.1-flash
      - qwen3.8-flash
      - qwen3.8-max
    sdk:
      haiku: deepseek-v4.1-flash
      sonnet: deepseek-v4.1-flash
      opus: qwen3.8-max
      subagent: deepseek-v4.1-flash
  worker-pool:
    max-idle: 6
    max-starting: 2
    max-live: 24
    min-available-memory-mib: 1024
