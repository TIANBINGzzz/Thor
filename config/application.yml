# 仅用于连接 Nacos；所有 Runtime 运行参数和客户配置以 Nacos 为准。
nacos: # 配置中心启动引导，可由本机 application.local.yml 或 CCSDK_NACOS_* 覆盖连接信息。
  server-addr: host.docker.internal:8848 # Nacos 主机及端口，可包含 http/https 协议。
  namespace: "" # Namespace ID，空值表示 public。
  group: DEFAULT_GROUP # 客户配置所属分组。
  data-id: ai-center-agent-service # 客户 YAML 的 Data ID。
  username: "" # Nacos 只读账号，允许匿名时留空。
  password: "" # Nacos 密码，与账号同时配置。
  timeout-ms: 10000 # 启动读取 Nacos 的完整预算，单位为毫秒。
  request-timeout-ms: 5000 # Nacos 单次网络请求超时，单位为毫秒。
