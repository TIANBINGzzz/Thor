# 本地编辑后发布到 Nacos 的客户配置示例；占位值须替换，应用只在启动时读取。
deployment: # 一套 Runtime 绑定一个客户。
  tenantId: customer-example # 与 Java Run JWT、业务 JWT 中的客户标识一致。
model: # 文本模型的 Anthropic 兼容服务。
  baseUrl: https://model.example.com/anthropic # 模型 API 地址，必须使用 HTTPS。
  apiKey: replace-model-api-key # 模型服务密钥，不与业务 Token 或 JWT 密钥共用。
security: # 控制面授权；未配置的可选接口保持关闭。
  runtimeJwtSecret: replace-runtime-jwt-secret # Java 与 Runtime 共用的执行 JWT 签名密钥。
  runtimeJwtIssuer: string-ai-center-service # 允许签发执行 JWT 的服务标识。
  runtimeJwtAudience: ccsdk-runtime # 执行 JWT 的接收方标识。
  observationJwtSecret: replace-observation-jwt-secret # 可选的观测读取密钥，必须独立。
  assetJwtSecret: replace-asset-jwt-secret # 可选的资产管理密钥，必须独立。
databases: # 客户部署启用的数据库来源，名称须与资产 source_key 一致。
  schoolDoubleHigh: # 校双高来源，保留大小写。
    connection: # 仅连接信息；表、列、函数和指标从登记资产读取。
      driver: mysql+pymysql # 数据库驱动，生产使用 MySQL。
      host: database.example.com # 客户数据库主机名或 IP。
      port: 3306 # 数据库端口，范围为 1–65535。
      database: customer_business # 客户业务库名。
      username: readonly_user # 仅授予查询权限的数据库账号。
      password: replace-database-password # 数据库密码，按原文使用，不做变量展开。
      tls: # 数据库 TLS 设置，默认为验证证书及主机名。
        mode: verify_identity # verify_identity 或显式 disabled。
        ca_file: certificates/database-ca.pem # CA 文件路径，相对仓库 config 目录，部署时只读挂载。
        verify_identity: true # 验证模式下必须为 true。
    query: # 查询执行预算，不承担用户或项目授权。
      timeout_seconds: 30 # 单次查询与数据库连接超时，范围为 1–120 秒。
      max_rows: 10000 # 单次取数上限，范围为 1–100000 行。
      dynamic_sql_enabled: true # 允许受 SQL AST 校验和客户过滤保护的只读动态查询。
fileService: # Java 附件下载与成果上传服务。
  baseUrl: https://files.example.com # 附件服务根地址。
  domainName: files.example.com # 附件接口需要的客户域名参数。
  remoteUrl: https://files.example.com # 成果上传接口使用的远端地址参数。
  downloadPath: /fwk_manage_service/sys_attachment/{fileId}/ai/download/ # 下载路由，保留 fileId 占位符。
  timeoutSeconds: 600 # 文件服务单次请求超时，范围为 1–3600 秒。
  maxFileBytes: 1073741824 # 文件服务大小上限，下载还受 Runtime 上限约束。
# fileBroker: # 可选的独立下载 Broker；启用时优先于 fileService 下载，不作故障回退。
#   url: https://broker.example.com/download # Broker 的 HTTPS 下载授权接口。
#   allowedHosts: [downloads.example.com] # Broker 返回下载 URL 时允许访问的主机列表。
#   authMode: run_jwt # run_jwt 转发本轮执行 JWT；service 使用独立服务凭据。
#   serviceToken: replace-broker-service-token # 仅 service 模式需要，不复用业务 Token。
#   caFile: /run/secrets/broker-ca.pem # 可选 CA 文件，使用部署注入的绝对路径。
#   clientCert: /run/secrets/broker-client.pem # 可选 mTLS 客户端证书，与 clientKey 成对配置。
#   clientKey: /run/secrets/broker-client.key # 可选 mTLS 私钥，与 clientCert 成对配置。
campusMcp: # 校园大脑业务服务，凭据按 Run 注入。
  url: https://campus.example.com/string_campus_brain_service/mcp # 校园 MCP 的 HTTPS 地址。
  domainName: campus.example.com # 校园业务接口使用的域名参数。
images: # 可选的图像生成服务，不需要时删除整个节点。
  baseUrl: https://images.example.com/v1 # 图像 API 根地址，必须显式配置。
  apiKey: replace-image-api-key # 图像服务密钥，不自动复用文本模型密钥。
  model: qwen-image-3.0 # 图像模型名称。
runtime: # 可选客户覆盖，未列出的字段沿用 application.yml 默认值。
  timeouts: # 以下超时单位均为毫秒。
    execution-ms: 3600000 # 附件准备完成后的单轮执行预算。
    client-queue-ms: 300000 # 等待可用 Client 的最长时间。
    file-prepare-ms: 600000 # 本轮全部附件准备预算。
  models: # 客户可选模型与 SDK 模型别名映射。
    default: deepseek-v4.1-flash # 未指定模型时使用的名称。
    available: [deepseek-v4.1-flash, qwen3.8-flash, qwen3.8-max] # 允许请求选择的模型列表。
    sdk: # SDK 内部别名，值须在 available 中。
      haiku: deepseek-v4.1-flash # 轻量任务模型。
      sonnet: deepseek-v4.1-flash # 常规任务模型。
      opus: qwen3.8-max # 高复杂度任务模型。
      subagent: deepseek-v4.1-flash # SDK 子任务模型，不声明额外项目代理。
  worker-pool: # 所有能力共享的 Client 容量。
    max-idle: 6 # 可预热的空闲 Client 数量。
    max-starting: 2 # 同时启动的 Client 数量。
    max-live: 24 # 同时存活的 Client 上限。
    min-available-memory-mib: 1024 # 启动新 Client 所需的最低可用内存。
  observability: # 本地有界观测缓冲，不配置外部采集平台地址。
    enabled: false # 是否采集脱敏观测事件。
    storage: .scribe-runs/observation.sqlite # 缓冲库路径，相对仓库根目录。
    max-records: 20000 # 最多保留的观测记录数。
    retention-seconds: 86400 # 观测记录保留秒数。
    queue-size: 2048 # 内存待写队列上限。
