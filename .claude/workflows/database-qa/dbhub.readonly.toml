# Non-sensitive DBHub provider settings for the database-qa workflow.
# Credentials are injected from the process environment at runtime.

[[sources]]
id = "hpm"
type = "mysql"
description = "国双高问数只读源。SQL 只能访问 workflow 白名单中的 12 张 t_hpm_project* 表；其他业务表和系统表均禁止访问。"
host = "${DB_HOST}"
port = 3306
database = "${DB_NAME}"
user = "${DB_USER}"
password = "${DB_PASSWORD}"
connection_timeout = 10
query_timeout = 30

[[tools]]
name = "execute_sql"
source = "hpm"
readonly = true
max_rows = 1000

[[tools]]
name = "search_objects"
source = "hpm"
