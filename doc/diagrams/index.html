<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CCSDK Scribe · 架构图</title>
  <style>
    :root{color-scheme:light;--ink:#173148;--muted:#5a6c7d;--blue:#236aab;--line:#d8e2e9;--bg:#f4f7fa}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Microsoft YaHei","PingFang SC",sans-serif}
    header,main{max-width:1728px;margin:auto;padding:18px 40px}header{padding-bottom:14px}
    .toolbar{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}nav,.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    button,.actions a{font:inherit;font-size:14px;cursor:pointer;border:1px solid var(--line);border-radius:6px;padding:10px 16px;background:white;color:var(--ink);text-decoration:none}
    button[aria-selected="true"]{background:var(--blue);border-color:var(--blue);color:white}button:focus-visible,a:focus-visible{outline:3px solid #70a6d1;outline-offset:3px}
    main{padding-top:0}figure{margin:0;background:white;border:1px solid var(--line);overflow:auto}figure img{display:block;width:100%;height:auto}figure.actual img{width:1680px;max-width:none}
    [hidden]{display:none!important}@media(max-width:640px){header,main{padding-left:16px;padding-right:16px}.actions,nav{gap:6px}button,.actions a{padding:9px 11px}}
    @media print{header{display:none}body{background:white}main{padding:0;max-width:none}[role="tabpanel"][hidden]{display:block!important}figure{border:0;overflow:visible;break-after:page}figure img,figure.actual img{width:100%!important}}
  </style>
</head>
<body>
<header>
  <div class="toolbar">
    <nav role="tablist" aria-label="架构视图">
      <button id="tab-system" role="tab" aria-selected="true" aria-controls="panel-system" data-name="system-architecture">分层总览</button>
      <button id="tab-lineage" role="tab" aria-selected="false" aria-controls="panel-lineage" data-name="request-lineage">请求与结果血缘</button>
    </nav>
    <div class="actions"><button id="zoom" aria-pressed="false">原始尺寸</button><a id="svg-link" href="system-architecture.svg" download>下载 SVG</a><a id="png-link" href="system-architecture.png" download>下载 PNG</a></div>
  </div>
</header>
<main>
  <section id="panel-system" role="tabpanel" aria-labelledby="tab-system"><figure><img src="system-architecture.svg" alt="Java 控制面、自研 Python Runtime、Claude Agent SDK 分层总览，包含业务能力小块及外部平台连接。"></figure></section>
  <section id="panel-lineage" role="tabpanel" aria-labelledby="tab-lineage" hidden><figure><img src="request-lineage.svg" alt="Java 业务请求经过 Python 会话调度和 SDK 执行，通过 SSE 和文件状态关联回业务消息。"></figure></section>
</main>
<script>
  const tabs=[...document.querySelectorAll('[role="tab"]')];
  const figures=[...document.querySelectorAll('figure')];
  function select(tab){
    tabs.forEach(item=>{const active=item===tab;item.setAttribute('aria-selected',String(active));document.getElementById(item.getAttribute('aria-controls')).hidden=!active;});
    document.getElementById('svg-link').href=tab.dataset.name+'.svg';
    document.getElementById('png-link').href=tab.dataset.name+'.png';
  }
  tabs.forEach((tab,index)=>{tab.addEventListener('click',()=>select(tab));tab.addEventListener('keydown',event=>{let target;if(event.key==='ArrowRight')target=(index+1)%tabs.length;if(event.key==='ArrowLeft')target=(index+tabs.length-1)%tabs.length;if(event.key==='Home')target=0;if(event.key==='End')target=tabs.length-1;if(target!==undefined){event.preventDefault();select(tabs[target]);tabs[target].focus();}});});
  document.getElementById('zoom').addEventListener('click',event=>{const button=event.currentTarget;const active=button.getAttribute('aria-pressed')!=='true';button.setAttribute('aria-pressed',String(active));button.textContent=active?'适应宽度':'原始尺寸';figures.forEach(figure=>figure.classList.toggle('actual',active));});
</script>
</body>
</html>
