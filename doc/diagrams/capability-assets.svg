<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1120" viewBox="0 0 1680 1120" role="img" aria-labelledby="title desc">
<title id="title">业务能力 · 执行资产关系</title><desc id="desc">能力是业务入口；Workflow、Skill、Tool 与模板 / 数据知识由自研 Python 组合。</desc>
<defs>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#236AAB"/></marker>
<marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#187A73"/></marker>
<marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#725393"/></marker>
<marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#5A6C7D"/></marker>
<marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#A26620"/></marker>
</defs>
<style>text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif} .mono{font-family:Consolas,"Microsoft YaHei",monospace}</style>
<rect width="1680" height="1120" fill="#FFFFFF"/>
<text x="64" y="55" fill="#5A6C7D" font-size="16" font-weight="600" text-anchor="start">CCSDK SCRIBE  /  ARCHITECTURE</text>
<text x="64" y="105" fill="#173148" font-size="38" font-weight="700" text-anchor="start">业务能力 · 执行资产关系</text>
<text x="64" y="140" fill="#5A6C7D" font-size="20" font-weight="400" text-anchor="start">能力是业务入口；Workflow、Skill、Tool 与模板 / 数据知识由自研 Python 组合。</text>
<rect x="64" y="184" width="1552" height="147" rx="12" fill="#EDF5FC" stroke="#236AAB" stroke-width="1.5"/>
<text x="88" y="222" fill="#236AAB" font-size="26" font-weight="700" text-anchor="start">Capability 业务能力</text>
<text x="88" y="264" fill="#173148" font-size="25" font-weight="400" text-anchor="start">文档撰写  ·  双高问数  ·  校园大脑问数  ·  通用对话  ·  图表生成  ·  图像生成</text>
<text x="88" y="307" fill="#5A6C7D" font-size="19" font-weight="400" text-anchor="start">联网检索是 web 工具，由获准能力复用；当前没有独立的“联网 Capability”。</text>
<path d="M249 331 L249 378" fill="none" stroke="#236AAB" stroke-width="2" marker-end="url(#blue)"/>
<rect x="64" y="378" width="370" height="129" rx="12" fill="#FFFFFF" stroke="#BCCBD6" stroke-width="1.5"/>
<text x="84" y="412" fill="#173148" font-size="23" font-weight="600" text-anchor="start">Workflow 流程规则</text>
<text x="84" y="444" fill="#5A6C7D" font-size="18" font-weight="400" text-anchor="start">可选 · 当前每能力最多 1 个</text>
<text x="84" y="471" fill="#5A6C7D" font-size="18" font-weight="400" text-anchor="start">执行方式 / 规则 / 模板需求</text>
<path d="M643 331 L643 378" fill="none" stroke="#236AAB" stroke-width="2" marker-end="url(#blue)"/>
<rect x="458" y="378" width="370" height="129" rx="12" fill="#FFFFFF" stroke="#BCCBD6" stroke-width="1.5"/>
<text x="478" y="412" fill="#173148" font-size="23" font-weight="600" text-anchor="start">Skill 可复用方法</text>
<text x="478" y="444" fill="#5A6C7D" font-size="18" font-weight="400" text-anchor="start">能力或 Workflow 引用方法</text>
<text x="478" y="471" fill="#5A6C7D" font-size="18" font-weight="400" text-anchor="start">Skill 不授予工具或数据权限</text>
<path d="M1037 331 L1037 378" fill="none" stroke="#236AAB" stroke-width="2" marker-end="url(#blue)"/>
<rect x="852" y="378" width="370" height="129" rx="12" fill="#FFFFFF" stroke="#BCCBD6" stroke-width="1.5"/>
<text x="872" y="412" fill="#173148" font-size="23" font-weight="600" text-anchor="start">Tool / MCP 工具</text>
<text x="872" y="444" fill="#5A6C7D" font-size="18" font-weight="400" text-anchor="start">能力声明工具与必要权限</text>
<text x="872" y="471" fill="#5A6C7D" font-size="18" font-weight="400" text-anchor="start">实际查询、编辑、搜索与发布</text>
<path d="M1431 331 L1431 378" fill="none" stroke="#236AAB" stroke-width="2" marker-end="url(#blue)"/>
<rect x="1246" y="378" width="370" height="129" rx="12" fill="#FFFFFF" stroke="#BCCBD6" stroke-width="1.5"/>
<text x="1266" y="412" fill="#173148" font-size="23" font-weight="600" text-anchor="start">模板 / 数据知识</text>
<text x="1266" y="444" fill="#5A6C7D" font-size="18" font-weight="400" text-anchor="start">模板指南 / 数据来源与语义</text>
<text x="1266" y="471" fill="#5A6C7D" font-size="18" font-weight="400" text-anchor="start">按登记与授权范围加载</text>
<path d="M434 453 L458 453" fill="none" stroke="#725393" stroke-width="2" marker-end="url(#purple)"/>
<path d="M249 507 L249 586" fill="none" stroke="#236AAB" stroke-width="2"/>
<path d="M643 507 L643 586" fill="none" stroke="#236AAB" stroke-width="2"/>
<path d="M1037 507 L1037 586" fill="none" stroke="#236AAB" stroke-width="2"/>
<path d="M1431 507 L1431 586" fill="none" stroke="#236AAB" stroke-width="2"/>
<path d="M249 586 L1431 586" fill="none" stroke="#236AAB" stroke-width="2"/>
<path d="M840 586 L840 621" fill="none" stroke="#236AAB" stroke-width="2" marker-end="url(#blue)"/>
<rect x="64" y="621" width="1552" height="110" rx="12" fill="#EDF5FC" stroke="#236AAB" stroke-width="1.5"/>
<text x="88" y="662" fill="#236AAB" font-size="28" font-weight="700" text-anchor="start">Python 统一装配</text>
<text x="88" y="700" fill="#173148" font-size="23" font-weight="400" text-anchor="start">冻结配置与资产版本   →   组合系统规则与 Skill 读取入口   →   绑定工具 / MCP / 凭据   →   ClaudeAgentOptions</text>
<path d="M840 731 L840 769" fill="none" stroke="#187A73" stroke-width="2" marker-end="url(#teal)"/>
<rect x="64" y="769" width="1552" height="79" rx="12" fill="#ECF7F4" stroke="#187A73" stroke-width="1.5"/>
<text x="840" y="818" fill="#187A73" font-size="26" font-weight="600" text-anchor="middle">Claude Agent SDK  ·  会话上下文 + 模型推理 + 工具执行 + 按需读取 Skill</text>
<text x="64" y="898" fill="#173148" font-size="23" font-weight="600" text-anchor="start">当前组合示例</text>
<rect x="64" y="919" width="494" height="110" rx="12" fill="#F5F7FA" stroke="#BCCBD6" stroke-width="1.5"/>
<text x="84" y="953" fill="#173148" font-size="23" font-weight="600" text-anchor="start">文档撰写</text>
<text x="84" y="985" fill="#5A6C7D" font-size="18" font-weight="400" text-anchor="start">document-writing → writing-docx</text>
<text x="84" y="1012" fill="#5A6C7D" font-size="18" font-weight="400" text-anchor="start">→ document-review + Office / 数据</text>
<rect x="588" y="919" width="494" height="110" rx="12" fill="#F5F7FA" stroke="#BCCBD6" stroke-width="1.5"/>
<text x="608" y="953" fill="#173148" font-size="23" font-weight="600" text-anchor="start">双高问数</text>
<text x="608" y="985" fill="#5A6C7D" font-size="18" font-weight="400" text-anchor="start">national-excellence-data-qa</text>
<text x="608" y="1012" fill="#5A6C7D" font-size="18" font-weight="400" text-anchor="start">→ double-high-qa + data</text>
<rect x="1112" y="919" width="504" height="110" rx="12" fill="#F5F7FA" stroke="#BCCBD6" stroke-width="1.5"/>
<text x="1132" y="953" fill="#173148" font-size="23" font-weight="600" text-anchor="start">校园大脑问数</text>
<text x="1132" y="985" fill="#5A6C7D" font-size="18" font-weight="400" text-anchor="start">campus-brain-query → campus</text>
<text x="1132" y="1012" fill="#5A6C7D" font-size="18" font-weight="400" text-anchor="start">直接组合工具，无 Workflow / Skill</text>
<text x="64" y="1092" fill="#5A6C7D" font-size="17" font-weight="400" text-anchor="start">当前 Workflow 是配置与规则组合，不是通用 DAG 引擎；可视化编写 / 发布管理属于外部平台规划。</text>
<text x="1616" y="1092" fill="#5A6C7D" font-size="17" font-weight="400" text-anchor="end">2026-10-12</text>
</svg>