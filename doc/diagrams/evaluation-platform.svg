<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title"><title id="title">评测平台</title>
<defs>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#245B96"/></marker>
<marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#667489"/></marker>
<marker id="planned" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8492A4"/></marker>
</defs>
<style>text{font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-weight:400} .heading{font-weight:600}</style>
<rect width="1600" height="900" fill="white"/>
<text x="48" y="83" font-size="36" fill="#245B96" text-anchor="start" class="heading">评测平台</text>
<text x="48" y="123" font-size="22" fill="#667489" text-anchor="start">面向 Workflow / Skill 的质量验证，统一测试集、预期结果与评分指标</text>
<rect x="48" y="174" width="480" height="260" rx="4" fill="#F7F8FA" stroke="#DCE3EB" stroke-width="1"/>
<text x="76" y="218" font-size="26" fill="#245B96" text-anchor="start" class="heading">测试集管理</text>
<text x="76" y="263" font-size="22" fill="#667489" text-anchor="start">管理评测用例与输入</text>
<text x="76" y="301" font-size="22" fill="#667489" text-anchor="start">组织 Workflow / Skill 测试集</text>
<rect x="560" y="174" width="480" height="260" rx="4" fill="#F7F8FA" stroke="#DCE3EB" stroke-width="1"/>
<text x="588" y="218" font-size="26" fill="#245B96" text-anchor="start" class="heading">预期结果管理</text>
<text x="588" y="263" font-size="22" fill="#667489" text-anchor="start">为用例维护预期结果</text>
<text x="588" y="301" font-size="22" fill="#667489" text-anchor="start">明确任务应达到的效果</text>
<rect x="1072" y="174" width="480" height="260" rx="4" fill="#F7F8FA" stroke="#DCE3EB" stroke-width="1"/>
<text x="1100" y="218" font-size="26" fill="#245B96" text-anchor="start" class="heading">评分指标设定</text>
<text x="1100" y="263" font-size="22" fill="#667489" text-anchor="start">定义评价维度与评分标准</text>
<text x="1100" y="301" font-size="22" fill="#667489" text-anchor="start">明确结果判定依据</text>
<path d="M288 434 L288 485 L800 485" fill="none" stroke="#245B96" stroke-width="1.6"/>
<path d="M800 434 L800 538" fill="none" stroke="#245B96" stroke-width="1.6" marker-end="url(#blue)"/>
<path d="M1312 434 L1312 485 L800 485" fill="none" stroke="#245B96" stroke-width="1.6"/>
<rect x="392" y="538" width="816" height="134" rx="4" fill="#F1F5FA" stroke="#DCE3EB" stroke-width="1"/>
<text x="420" y="582" font-size="26" fill="#245B96" text-anchor="start" class="heading">Workflow / Skill 评测</text>
<text x="420" y="627" font-size="22" fill="#667489" text-anchor="start">执行测试用例，对照预期结果，按指标评分</text>
<path d="M800 672 L800 723" fill="none" stroke="#245B96" stroke-width="1.6" marker-end="url(#blue)"/>
<rect x="392" y="723" width="816" height="116" rx="4" fill="#F7F8FA" stroke="#DCE3EB" stroke-width="1"/>
<text x="420" y="767" font-size="26" fill="#245B96" text-anchor="start" class="heading">评测结果</text>
<text x="420" y="812" font-size="22" fill="#667489" text-anchor="start">汇总得分与未达预期项，形成质量验证依据</text>
</svg>