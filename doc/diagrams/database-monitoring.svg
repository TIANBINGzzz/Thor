<text x="98" y="743" font-size="22" fill="#182B43" text-anchor="start">删除数据库配置</text>
<path d="M512 506 L640 506" fill="none" stroke="#245B96" stroke-width="1.6" marker-end="url(#blue)"/>
<text x="576" y="486" font-size="20" fill="#245B96" text-anchor="middle">配置检查</text>
