metrics:
  - id: national_double_high_project
    name: 国双高项目名称
    description: 查询授权范围内指定有效国双高项目的名称，学校建设项目与专业群项目均按项目定位。
    parameters:
      - project_id
    grain: project
    sql: |
      SELECT p.id_ AS project_id, p.name_ AS project_name
      FROM t_hpm_project p
      WHERE p.tenant_id_ = :tenant_id
        AND p.id_ = :project_id
        AND p.delete_flag_ = '0'
        AND p.high_flag_ = '1'
      ORDER BY p.name_, p.id_
    output:
      project_id: 项目ID，仅用于关联
      project_name: 项目名称，用于正文和标题
    validation:
      row_count: 必须等于1，否则项目未唯一定位，停止使用结果
      project_name: 非空

  - id: annual_project_stage
    name: 项目年度阶段
    description: 按指定项目和年度定位阶段；阶段日期是数据库登记值，不自动等同报告统计截止日。
    parameters:
      - project_id
      - year
    grain: project_stage
    sql: |
      SELECT s.project_id_ AS project_id, s.id_ AS stage_id,
             s.name_ AS stage_name, s.start_time_ AS start_time,
             s.end_time_ AS end_time
      FROM t_hpm_project_stage s
      JOIN t_hpm_project p
        ON p.tenant_id_ = s.tenant_id_ AND p.id_ = s.project_id_
      WHERE s.tenant_id_ = :tenant_id
        AND s.project_id_ = :project_id
        AND s.name_ = :year
        AND s.delete_flag_ = '0'
        AND p.delete_flag_ = '0'
        AND p.high_flag_ = '1'
      ORDER BY s.id_
    output:
      project_id: 项目ID，仅用于关联
      stage_id: 阶段ID，仅用于关联
      stage_name: 年度阶段名称
      start_time: 登记开始时间
      end_time: 登记结束时间
    validation:
      row_count: 必须等于1；无记录或同年多阶段时先消歧，再进行年度统计
      stage_name: 必须与year完全一致
      end_time: 开始和结束时间均有值时，结束时间不得早于开始时间

  - id: annual_level3_task_progress
    name: 年度三级任务数量与平均进度
    description: 按项目和年度统计有效国双高三级任务的当前进度；未填进度按0参与均值并披露缺失数。平均进度、按条数完成率、逐项超过100%分别计算；结果不是历史截止日快照。
    parameters:
      - project_id
      - year
    grain: project_year
    sql: |
      SELECT COUNT(*) AS task_count,
             ROUND(AVG(COALESCE(t.progress_, 0)), 2) AS avg_progress,
             COUNT(CASE WHEN t.progress_ IS NULL THEN 1 END)
               AS missing_progress_count,
             COUNT(CASE WHEN t.progress_ >= 100 THEN 1 END)
               AS completed_count,
             ROUND(100.0 * COUNT(CASE WHEN t.progress_ >= 100 THEN 1 END)
               / NULLIF(COUNT(*), 0), 2) AS completion_rate,
             COUNT(CASE WHEN t.progress_ > 100 THEN 1 END)
               AS above_100_count,
             CASE
               WHEN COUNT(*) = 0 OR COUNT(t.progress_) < COUNT(*) THEN NULL
               WHEN MIN(t.progress_) > 100 THEN 1
               ELSE 0
             END AS all_above_100
      FROM t_hpm_project_task t
      WHERE t.tenant_id_ = :tenant_id
        AND t.project_id_ = :project_id
        AND t.delete_flag_ = '0'
        AND t.high_flag_ = '1'
        AND t.level_ = 3
        AND EXISTS (
          SELECT 1 FROM t_hpm_project_stage s
          WHERE s.tenant_id_ = t.tenant_id_
            AND s.project_id_ = t.project_id_
            AND s.id_ = t.stage_id_
            AND s.delete_flag_ = '0'
            AND s.name_ = :year
        )
    output:
      task_count: 三级任务数量，单位项
      avg_progress: 平均进度，单位百分比，允许超过100
      missing_progress_count: 未填报进度的任务数量，单位项
      completed_count: 进度大于等于100的任务数量，单位项
      completion_rate: 已完成任务数量占比，单位百分比
      above_100_count: 进度严格大于100的任务数量，单位项
      all_above_100: 全部任务严格超过100为1，否则为0；无任务或存在未填报时为null
    validation:
      task_count: 整数且大于等于0；0仅表示范围内无记录
      missing_progress_count: 整数，介于0和task_count之间
      completed_count: 整数，介于0和task_count减missing_progress_count之间
      avg_progress: 无任务时为null，否则等于未填进度按0计算的算术平均值，保留两位小数
      completion_rate: 无任务时为null，否则等于completed_count除以task_count乘100，保留两位小数
      above_100_count: 整数，介于0和completed_count之间
      all_above_100: 无任务或有未填报时为null；否则仅当above_100_count等于task_count时为1

  - id: project_performance_categories
    name: 项目绩效一二级分类目录
    description: 获取指定国双高项目的一二级绩效分类并保留父键和阶段归属；此查询只提供分类目录，不计算年度进度、自评得分或权重，不自动映射为正式评分表。
    parameters:
      - project_id
    grain: project_performance_node
    sql: |
      SELECT perf.project_id_ AS project_id, perf.id_ AS performance_id,
             perf.parent_id_ AS parent_id, perf.stage_id_ AS stage_id,
             perf.code_ AS performance_code, perf.name_ AS performance_name,
             perf.level_ AS performance_level
      FROM t_hpm_project_performance perf
      JOIN t_hpm_project p
        ON p.tenant_id_ = perf.tenant_id_ AND p.id_ = perf.project_id_
      WHERE perf.tenant_id_ = :tenant_id
        AND perf.project_id_ = :project_id
        AND perf.delete_flag_ = '0'
        AND perf.level_ IN (1, 2)
        AND p.delete_flag_ = '0'
        AND p.high_flag_ = '1'
      ORDER BY perf.level_, perf.code_, perf.id_
    output:
      project_id: 项目ID，仅用于关联
      performance_id: 绩效分类ID，仅用于关联
      parent_id: 父分类ID，用于恢复路径
      stage_id: 所属阶段ID，空值表示无阶段分类
      performance_code: 分类编码，不作为唯一键
      performance_name: 分类名称，不包含已核验评分含义
      performance_level: 分类层级，1为一级、2为二级
    validation:
      performance_id: 同一项目内唯一且非空
      performance_name: 非空
      performance_level: 只能为1或2
      parent_id: 二级分类必须能关联同项目的一级分类；缺父节点时停止组装该分类路径

  - id: project_cycle_budget
    name: 项目全建设期预算
    description: 汇总指定国双高项目无阶段的有效一级资金节点预算，单位万元；不与年度预算相加。一级节点数量按实际记录确定，不固定为十项。
    parameters:
      - project_id
    grain: project
    sql: |
      SELECT COUNT(*) AS fund_count,
             COUNT(f.budget_total_money_) AS budget_observed_count,
             ROUND(SUM(f.budget_total_money_), 2) AS cycle_budget_amount
      FROM t_hpm_project_fund f
      JOIN t_hpm_project p
        ON p.tenant_id_ = f.tenant_id_ AND p.id_ = f.project_id_
      WHERE f.tenant_id_ = :tenant_id
        AND f.project_id_ = :project_id
        AND f.delete_flag_ = '0' AND f.level_ = 1
        AND p.delete_flag_ = '0' AND p.high_flag_ = '1'
        AND (f.stage_id_ IS NULL OR TRIM(f.stage_id_) = '')
    output:
      fund_count: 无阶段一级资金记录数量
      budget_observed_count: 已填报预算的记录数量
      cycle_budget_amount: 已填报的全建设期预算合计，单位万元
    validation:
      budget_observed_count: 介于0和fund_count之间；不等于fund_count时金额仅是已填报部分
      cycle_budget_amount: 无记录或预算全部未填时为null；记录非空且预算全填报后才能作为完整预算；登记为0不证明业务预算确为0

  - id: annual_project_funds
    name: 项目年度预算到位与执行
    description: 汇总指定国双高项目指定年度的有效一级资金节点，金额单位万元、比率单位百分比。只反映年度记录当前值；不能直接充当截至某日累计到位、执行金额或全周期预算对应的执行率。
    parameters:
      - project_id
      - year
    grain: project_year
    sql: |
      WITH amounts AS (
        SELECT COUNT(*) AS fund_count,
               SUM(f.budget_total_money_) AS budget_amount,
               COUNT(f.budget_total_money_) AS budget_observed_count,
               SUM(f.arrival_total_money_) AS arrival_amount,
               COUNT(f.arrival_total_money_) AS arrival_observed_count,
               SUM(f.execute_total_money_) AS execute_amount,
               COUNT(f.execute_total_money_) AS execute_observed_count
        FROM t_hpm_project_fund f
        JOIN t_hpm_project p
          ON p.tenant_id_ = f.tenant_id_ AND p.id_ = f.project_id_
        WHERE f.tenant_id_ = :tenant_id
          AND f.project_id_ = :project_id
          AND f.delete_flag_ = '0' AND f.level_ = 1
          AND p.delete_flag_ = '0' AND p.high_flag_ = '1'
          AND EXISTS (
            SELECT 1 FROM t_hpm_project_stage s
            WHERE s.tenant_id_ = f.tenant_id_
              AND s.project_id_ = f.project_id_ AND s.id_ = f.stage_id_
              AND s.delete_flag_ = '0' AND s.name_ = :year
          )
      )
      SELECT fund_count, budget_amount, budget_observed_count,
             arrival_amount, arrival_observed_count,
             execute_amount, execute_observed_count,
             CASE WHEN budget_observed_count = fund_count
                        AND arrival_observed_count = fund_count
               THEN ROUND(100.0 * arrival_amount / NULLIF(budget_amount, 0), 2)
             END AS arrival_rate,
             CASE WHEN budget_observed_count = fund_count
                        AND execute_observed_count = fund_count
               THEN ROUND(100.0 * execute_amount / NULLIF(budget_amount, 0), 2)
             END AS budget_execution_rate,
             CASE WHEN arrival_observed_count = fund_count
                        AND execute_observed_count = fund_count
               THEN ROUND(100.0 * execute_amount / NULLIF(arrival_amount, 0), 2)
             END AS arrival_execution_rate
      FROM amounts
    output:
      fund_count: 年度一级资金记录数量
      budget_amount: 已填报预算合计，单位万元
      budget_observed_count: 已填报预算的记录数量
      arrival_amount: 已填报到位金额合计，单位万元
      arrival_observed_count: 已填报到位金额的记录数量
      execute_amount: 已填报执行金额合计，单位万元
      execute_observed_count: 已填报执行金额的记录数量
      arrival_rate: 到位金额除以年度预算乘100
      budget_execution_rate: 执行金额除以年度预算乘100
      arrival_execution_rate: 执行金额除以到位金额乘100
    validation:
      fund_count: 整数且大于等于0；无记录时金额和比率均为null
      observed_counts: 各已填报数量介于0和fund_count之间；未全填报的金额仅能作为已填报部分
      rates: 分子分母对应金额均全填报且分母非0时计算，否则为null；保留两位小数，不强行封顶为100
      amounts: 到位为0但执行大于0时标记矛盾，先核实后解释；万元换算亿元除以10000

  - id: report_task_feedback
    name: 报告期已审核任务反馈材料
    description: 查询指定项目年度及日期窗口内已审核的任务反馈，作为成果整理和AI撰写的材料来源；无记录或测试式内容不否定SQL来源，反馈条数不等于成果数量。
    parameters:
      - project_id
      - year
      - start_date
      - end_date
      - task_id
    grain: project_task_feedback
    sql: |
      SELECT tf.id_ AS feedback_id, t.project_id_ AS project_id, t.id_ AS task_id,
             t.name_ AS task_name, tf.date_ AS feedback_date, tf.create_time_ AS submitted_at,
             tf.content_ AS content, tf.progress_ AS progress, tf.complete_progress_ AS complete_progress,
             CASE WHEN tf.attachment_ IS NOT NULL AND tf.attachment_ <> '' AND tf.attachment_ <> '[]' THEN 1 ELSE 0 END AS has_attachment
      FROM t_hpm_project_task t
      JOIN t_hpm_project_task_feedback tf ON tf.tenant_id_ = :tenant_id
        AND tf.tenant_id_ = t.tenant_id_ AND tf.project_id_ = t.project_id_ AND tf.task_id_ = t.id_
      WHERE t.tenant_id_ = :tenant_id AND t.delete_flag_ = '0' AND t.high_flag_ = '1'
        AND t.stage_id_ IS NOT NULL
        AND (:project_id IS NULL OR t.project_id_ = :project_id)
        AND (:year IS NULL OR EXISTS (
          SELECT 1 FROM t_hpm_project_stage s
          WHERE s.tenant_id_ = :tenant_id AND s.tenant_id_ = t.tenant_id_
            AND s.project_id_ = t.project_id_ AND s.id_ = t.stage_id_
            AND s.delete_flag_ = '0' AND s.name_ = :year
        )) AND tf.delete_flag_ = '0' AND tf.state_ = '1'
        AND (:task_id IS NULL OR t.id_ = :task_id)
        AND (:start_date IS NULL OR tf.date_ >= :start_date)
        AND (:end_date IS NULL OR tf.date_ < :end_date)
      ORDER BY t.project_id_, t.id_, tf.date_, tf.id_
    output:
      feedback_id: 反馈ID，用于去重和追溯
      project_id: 项目ID，仅用于关联
      task_id: 任务ID，仅用于关联
      task_name: 任务名称
      feedback_date: 反馈业务日期
      submitted_at: 提交时间，不替代业务日期
      content: 反馈正文，供AI提取有依据的成果与事实
      progress: 反馈进度
      complete_progress: 反馈完成进度原值，不直接作为成果数量或自评分
      has_attachment: 附件字段是否非空，1为有、0为无；不代表附件已读取或内容有效
    validation:
      parameters: 项目、年度和起止日期须明确；task_id可为null表示该范围全部任务；日期窗口为起日包含、止日不含
      feedback_id: 同项目内唯一，重复反馈不得重复计算成果
      content: 空白或缺乏事实时记录材料不足，不生成成果；不因此否定查询结构
      row_count: 允许0行，只表示该范围无符合条件的反馈
      has_attachment: 只能为0或1；附件内容须另外核验
      chapter_scope: 按项目年度任务层级目录确定本节三级任务ID集合，逐任务查询并按反馈键去重；跨页段落作为完整材料处理，同一成果多次反馈不重复计数
      evidence: 成果须保留对象、名称、期间、级别、单位和证据；计划与实绩、新增与累计、人数与人次及人日分别记录；图示关系、排名和唯一性判断须有相应材料

  - id: annual_project_task_tree
    name: "项目年度任务层级目录"
    description: "获取项目年度任务父子关系，按本周期已确认的任务编码定位一级任务，通过同项目同阶段父键定位其二级及三级任务，供章节反馈和绩效取数使用。不同建设周期任务名称可不同；本轮已确认按原SQL编码1取落实立德树人根本任务。目标和完成值为任务当前原值，不替代绩效值或历史快照。"
    parameters: ["project_id","year"]
    grain: "project_stage_task"
    sql: |
      SELECT t.project_id_ AS project_id, t.stage_id_ AS stage_id, t.id_ AS task_id,
             t.parent_id_ AS parent_id, t.name_ AS task_name, t.code_ AS task_code,
             t.level_ AS task_level, t.target_value_ AS target_value,
             t.complete_value_ AS complete_value, t.progress_ AS current_progress
      FROM t_hpm_project_task t WHERE t.tenant_id_ = :tenant_id AND t.delete_flag_ = '0' AND t.high_flag_ = '1'
        AND t.stage_id_ IS NOT NULL
        AND (:project_id IS NULL OR t.project_id_ = :project_id)
        AND (:year IS NULL OR EXISTS (
          SELECT 1 FROM t_hpm_project_stage s
          WHERE s.tenant_id_ = :tenant_id AND s.tenant_id_ = t.tenant_id_
            AND s.project_id_ = t.project_id_ AND s.id_ = t.stage_id_
            AND s.delete_flag_ = '0' AND s.name_ = :year
        ))
      ORDER BY t.project_id_, t.stage_id_, t.level_, t.code_, t.id_
    output:
      project_id: "项目ID，仅用于关联"
      stage_id: "年度阶段ID，仅用于关联"
      task_id: "任务ID，仅用于关联"
      parent_id: "父任务ID，用于构建章节下属任务集合"
      task_name: "任务名称，用于确认章节对应关系"
      task_code: "任务编码，不假定跨项目编码含义一致"
      task_level: "任务层级"
      target_value: "任务目标原值"
      complete_value: "任务完成原值"
      current_progress: "任务当前进度，不作为绩效完成率或自评分"
    validation:
      parameters: "项目和年度必须明确，执行前唯一定位年度阶段"
      task_id: "同项目同阶段唯一；下属任务须按父键逐层关联，不按名称模糊归并"
      scope: "本轮按用户提供SQL的编码1定位落实立德树人根本任务，再取其二级任务下的三级任务；此映射已确认，名称与旧周期模板不同不构成来源问题。其他编码依相应SQL和周期映射处理，不将编码1扩大用于所有章节"
      hierarchy: "项目年度内一级任务编码应唯一；按同项目同阶段父键逐层取得三级任务，检查遗漏和重复归属。旧模板章节序号不直接作为新周期任务编码"
      row_count: "允许0行；目标、完成值保留原类型，缺失不转0"

  - id: annual_task_performance_links
    name: "年度三级任务关联绩效目标与完成值"
    description: "查询项目年度三级任务经任务绩效关系关联的绩效当前目标和完成原值，按模块阶段配置选择年度或无阶段绩效。使用年度任务层级目录限定章节下属三级任务；一个绩效关联多个任务时按绩效ID去重展示，不累加。"
    parameters: ["project_id","year"]
    grain: "task_performance"
    sql: |
      SELECT DISTINCT t.id_ AS task_id, perf.id_ AS performance_id,
             t.name_ AS task_name, perf.name_ AS performance_name,
             p1.name_ AS first_performance_name, p2.name_ AS second_performance_name,
             perf.target_value_ AS current_target_value, perf.finish_value_ AS current_finish_value
      FROM t_hpm_project_task t
      JOIN t_hpm_project_stage s ON s.tenant_id_=t.tenant_id_ AND s.project_id_=t.project_id_ AND s.id_=t.stage_id_
      JOIN t_hpm_project p ON p.tenant_id_=t.tenant_id_ AND p.id_=t.project_id_
      JOIN t_hpm_project_task_performance_relation r
        ON r.tenant_id_=t.tenant_id_ AND r.project_id_=t.project_id_ AND r.task_id_=t.id_
      JOIN t_hpm_project_performance perf
        ON perf.tenant_id_=r.tenant_id_ AND perf.project_id_=r.project_id_ AND perf.id_=r.performance_id_
      LEFT JOIN t_hpm_project_performance p1
        ON p1.tenant_id_=perf.tenant_id_ AND p1.project_id_=perf.project_id_ AND p1.id_=perf.first_item_id_
        AND p1.level_=1 AND p1.delete_flag_='0'
      LEFT JOIN t_hpm_project_performance p2
        ON p2.tenant_id_=perf.tenant_id_ AND p2.project_id_=perf.project_id_ AND p2.id_=perf.second_item_id_
        AND p2.level_=2 AND p2.delete_flag_='0'
      WHERE t.tenant_id_=:tenant_id AND t.delete_flag_='0' AND t.high_flag_='1' AND t.level_=3
        AND s.delete_flag_='0' AND s.name_=:year
        AND p.delete_flag_='0' AND p.high_flag_='1' AND perf.delete_flag_='0' AND perf.level_>=3
        AND (:project_id IS NULL OR t.project_id_=:project_id)
        AND EXISTS (SELECT 1 FROM t_hpm_project_module m
          WHERE m.tenant_id_=p.tenant_id_ AND m.project_id_=p.id_ AND m.delete_flag_='0'
            AND ((m.performance_stage_flag_='0' AND (perf.stage_id_ IS NULL OR TRIM(perf.stage_id_)=''))
              OR (m.performance_stage_flag_='1' AND perf.stage_id_=t.stage_id_)))
      ORDER BY t.id_, perf.id_
    output:
      task_id: "三级任务ID，用于与章节下属任务集合关联"
      performance_id: "绩效ID，用于同项目内去重"
      task_name: "三级任务名称"
      performance_name: "具体绩效指标名称"
      first_performance_name: "一级绩效分类名称"
      second_performance_name: "二级绩效分类名称"
      current_target_value: "绩效当前目标原值，保留定量或定性内容"
