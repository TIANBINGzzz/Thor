metrics:
  - id: national_double_high_project
    name: 国双高项目名称
    description: 查询授权范围内指定有效国双高项目的名称，学校建设项目与专业群项目均按项目定位。
    parameters:
      - project_id
    grain: project
    sql: |
      SELECT p.id_ AS project_id, p.name_ AS project_name
      FROM t_hpm_project p
      WHERE p.tenant_id_ = :tenant_id
        AND p.id_ = :project_id
        AND p.delete_flag_ = '0'
        AND p.high_flag_ = '1'
      ORDER BY p.name_, p.id_
    output:
      project_id: 项目ID，仅用于关联
      project_name: 项目名称，用于正文和标题
    validation:
      row_count: 必须等于1，否则项目未唯一定位，停止使用结果
      project_name: 非空

  - id: annual_project_stage
    name: 项目年度阶段
    description: 按指定项目和年度定位阶段；阶段日期是数据库登记值，不自动等同报告统计截止日。
    parameters:
      - project_id
      - year
    grain: project_stage
    sql: |
      SELECT s.project_id_ AS project_id, s.id_ AS stage_id,
             s.name_ AS stage_name, s.start_time_ AS start_time,
             s.end_time_ AS end_time
      FROM t_hpm_project_stage s
      JOIN t_hpm_project p
        ON p.tenant_id_ = s.tenant_id_ AND p.id_ = s.project_id_
      WHERE s.tenant_id_ = :tenant_id
        AND s.project_id_ = :project_id
        AND s.name_ = :year
        AND s.delete_flag_ = '0'
        AND p.delete_flag_ = '0'
        AND p.high_flag_ = '1'
      ORDER BY s.id_
    output:
      project_id: 项目ID，仅用于关联
      stage_id: 阶段ID，仅用于关联
      stage_name: 年度阶段名称
      start_time: 登记开始时间
      end_time: 登记结束时间
    validation:
      row_count: 必须等于1；无记录或同年多阶段时先消歧，再进行年度统计
      stage_name: 必须与year完全一致
      end_time: 开始和结束时间均有值时，结束时间不得早于开始时间

  - id: annual_level3_task_progress
    name: 年度三级任务数量与平均进度
    description: 按项目和年度统计有效国双高三级任务的当前进度；未填进度按0参与均值并披露缺失数。平均进度、按条数完成率、逐项超过100%分别计算；结果不是历史截止日快照。
    parameters:
      - project_id
      - year
    grain: project_year
    sql: |
      SELECT COUNT(*) AS task_count,
             ROUND(AVG(COALESCE(t.progress_, 0)), 2) AS avg_progress,
             COUNT(CASE WHEN t.progress_ IS NULL THEN 1 END)
               AS missing_progress_count,
             COUNT(CASE WHEN t.progress_ >= 100 THEN 1 END)
               AS completed_count,
             ROUND(100.0 * COUNT(CASE WHEN t.progress_ >= 100 THEN 1 END)
               / NULLIF(COUNT(*), 0), 2) AS completion_rate,
             COUNT(CASE WHEN t.progress_ > 100 THEN 1 END)
               AS above_100_count,
             CASE
               WHEN COUNT(*) = 0 OR COUNT(t.progress_) < COUNT(*) THEN NULL
               WHEN MIN(t.progress_) > 100 THEN 1
               ELSE 0
             END AS all_above_100
      FROM t_hpm_project_task t
      WHERE t.tenant_id_ = :tenant_id
        AND t.project_id_ = :project_id
        AND t.delete_flag_ = '0'
        AND t.high_flag_ = '1'
        AND t.level_ = 3
        AND EXISTS (
          SELECT 1 FROM t_hpm_project_stage s
          WHERE s.tenant_id_ = t.tenant_id_
            AND s.project_id_ = t.project_id_
            AND s.id_ = t.stage_id_
            AND s.delete_flag_ = '0'
            AND s.name_ = :year
        )
    output:
      task_count: 三级任务数量，单位项
      avg_progress: 平均进度，单位百分比，允许超过100
      missing_progress_count: 未填报进度的任务数量，单位项
      completed_count: 进度大于等于100的任务数量，单位项
      completion_rate: 已完成任务数量占比，单位百分比
      above_100_count: 进度严格大于100的任务数量，单位项
      all_above_100: 全部任务严格超过100为1，否则为0；无任务或存在未填报时为null
    validation:
      task_count: 整数且大于等于0；0仅表示范围内无记录
      missing_progress_count: 整数，介于0和task_count之间
      completed_count: 整数，介于0和task_count减missing_progress_count之间
      avg_progress: 无任务时为null，否则等于未填进度按0计算的算术平均值，保留两位小数
      completion_rate: 无任务时为null，否则等于completed_count除以task_count乘100，保留两位小数
      above_100_count: 整数，介于0和completed_count之间
      all_above_100: 无任务或有未填报时为null；否则仅当above_100_count等于task_count时为1

  - id: project_performance_categories
    name: 项目绩效一二级分类目录
    description: 获取指定国双高项目的一二级绩效分类并保留父键和阶段归属；此查询只提供分类目录，不计算年度进度、自评得分或权重，不自动映射为正式评分表。
    parameters:
      - project_id
    grain: project_performance_node
    sql: |
      SELECT perf.project_id_ AS project_id, perf.id_ AS performance_id,
             perf.parent_id_ AS parent_id, perf.stage_id_ AS stage_id,
             perf.code_ AS performance_code, perf.name_ AS performance_name,
             perf.level_ AS performance_level
      FROM t_hpm_project_performance perf
      JOIN t_hpm_project p
        ON p.tenant_id_ = perf.tenant_id_ AND p.id_ = perf.project_id_
      WHERE perf.tenant_id_ = :tenant_id
        AND perf.project_id_ = :project_id
        AND perf.delete_flag_ = '0'
        AND perf.level_ IN (1, 2)
        AND p.delete_flag_ = '0'
        AND p.high_flag_ = '1'
      ORDER BY perf.level_, perf.code_, perf.id_
    output:
      project_id: 项目ID，仅用于关联
      performance_id: 绩效分类ID，仅用于关联
      parent_id: 父分类ID，用于恢复路径
      stage_id: 所属阶段ID，空值表示无阶段分类
      performance_code: 分类编码，不作为唯一键
      performance_name: 分类名称，不包含已核验评分含义
      performance_level: 分类层级，1为一级、2为二级
    validation:
      performance_id: 同一项目内唯一且非空
      performance_name: 非空
      performance_level: 只能为1或2
      parent_id: 二级分类必须能关联同项目的一级分类；缺父节点时停止组装该分类路径
