<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f8fb">
<title>师创智能体 · 会话运行原型</title>
<link rel="icon" href="assets/ai-icon.png">
<style>
:root {
  color-scheme: light;
  --ink: #202633;
  --muted: #707b8c;
  --blue: #0170fe;
  --line: #e9ecf1;
  font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  color: var(--ink);
  background: #0454f8;
}
* { box-sizing: border-box; }
body { margin: 0; height: 100dvh; overflow: hidden; font-size: 14px; -webkit-font-smoothing: antialiased; }
button, textarea, select { font: inherit; color: inherit; }
button, summary, select { -webkit-tap-highlight-color: transparent; }
button { cursor: pointer; }
button:focus-visible, summary:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid #3478e54d; outline-offset: 2px; }
[hidden] { display: none !important; }
::selection { background: #d6e8ff; color: #173e77; }
.app-shell { height: 100%; padding: 8px; background: linear-gradient(180deg, #0454f8, #5098fa); }
.conversation { height: 100%; display: flex; flex-direction: column; overflow: hidden; border-radius: 16px; background: #fff url("assets/chat-bg.png") center / 100% 100% no-repeat; }
.chat-header { display: grid; grid-template-columns: 1fr minmax(0, 2fr) 1fr; align-items: center; gap: 12px; height: 53px; flex-shrink: 0; padding: 0 18px; border-bottom: 1px solid #1f2a3913; background: #fffffff0; }
.chat-heading { min-width: 0; text-align: center; }
#sessionSelect { max-width: 100%; padding: 0 5px; border: 0; background: transparent; color: #2a303b; font-size: 15px; font-weight: 610; text-overflow: ellipsis; cursor: pointer; }
.chat-subtitle { margin-top: 1px; color: var(--muted); font-size: 12px; }
.header-right { justify-self: end; }
.subtle-button, #demoControl { border: 1px solid #e8edf4; border-radius: 8px; padding: 7px 9px; background: #fff; color: #687488; font-size: 12px; }
.subtle-button:hover, #demoControl:hover { background: #f7f8fa; }
.chat-scroll { flex: 1; min-height: 0; overflow: auto; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: #dce1e8 transparent; }
.thread { width: min(1000px, calc(100% - 64px)); margin: 0 auto; padding: 27px 0 24px; }
.conversation-intro { display: flex; align-items: center; gap: 8px; margin-bottom: 27px; color: var(--muted); font-size: 13px; }
.capability-pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 8px; border: 1px solid #e8edf4; border-radius: 6px; background: #fff; color: #687589; }
.capability-pill svg { width: 13px; height: 13px; color: #6f91bf; }
.turn { margin-bottom: 28px; }
.turn:last-child { margin-bottom: 0; }
.user-message { display: flex; justify-content: flex-end; margin-bottom: 28px; }
.user-message-wrap { display: flex; flex-direction: column; align-items: flex-end; max-width: min(76%, 610px); }
.user-bubble { padding: 11px 14px; border-radius: 13px 13px 4px 13px; background: #f2f8ff; color: #343c49; font-size: 16px; line-height: 1.72; white-space: pre-wrap; overflow-wrap: anywhere; }
.message-hint { margin: 6px 3px 0; color: var(--muted); font-size: 12px; }
.assistant-message { display: flex; align-items: flex-start; gap: 10px; }
.assistant-mark { width: 30px; height: 30px; flex-shrink: 0; margin-top: 1px; }
.assistant-content { flex: 1; min-width: 0; max-width: 850px; padding-top: 2px; }
.assistant-label { margin: 1px 0 6px; color: #6b7585; font-size: 13px; font-weight: 590; }
.processing-time { margin: 0 0 8px; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.process-summary { list-style: none; display: flex; align-items: center; gap: 7px; width: fit-content; padding: 6px 9px; border: 1px solid #edf0f4; border-radius: 7px; background: #ffffffb3; color: #697789; cursor: pointer; font-size: 13px; }
.process-summary:hover { border-color: #c7dcf9; color: var(--blue); }
summary::-webkit-details-marker { display: none; }
.status-dot { width: 6px; height: 6px; border-radius: 50%; background: #8b95a3; flex-shrink: 0; }
.status-dot.active { background: #4e88de; animation: pulse 1.6s ease-in-out infinite; }
.chevron { margin-left: 3px; font-size: 17px; line-height: 14px; }
.run-process[open] > summary .chevron { transform: rotate(90deg); }
.inline-timeline { list-style: none; margin: 15px 0 4px 12px; padding: 0; }
.timeline-node { position: relative; padding: 0 0 15px 20px; border-left: 1px solid #e1e8f1; color: #758194; font-size: 13px; line-height: 1.6; }
.timeline-node:last-child { padding-bottom: 0; border-left-color: transparent; }
.node-dot { position: absolute; left: -3.5px; top: 7px; width: 6px; height: 6px; border-radius: 50%; background: #a7bbd6; box-shadow: 0 0 0 4px #fff; }
.assistant-text { margin-top: 14px; color: #373f4d; font-size: 16px; line-height: 1.85; white-space: pre-wrap; overflow-wrap: anywhere; }
.terminal-note { margin-top: 12px; color: #717c8c; font-size: 13px; }
.terminal-note.failed { color: #b1433c; }
.retry-button { margin-top: 12px; border: 1px solid #dce6f4; border-radius: 6px; padding: 6px 10px; background: #fff; color: #3773bf; font-size: 12px; }
.file-chip { display: flex; align-items: center; gap: 8px; width: fit-content; flex-wrap: wrap; margin-top: 11px; padding: 9px 11px; border: 1px solid #e8edf3; border-radius: 9px; background: #fff; color: #475264; font-size: 13px; }
.file-icon { display: grid; width: 25px; height: 27px; place-items: center; border: 1px solid #f0dddd; border-radius: 5px; background: #fff7f6; color: #c06d67; font-size: 11px; }
.file-chip small { color: var(--muted); font-size: 11px; }
.composer-wrap { flex-shrink: 0; padding: 14px 24px 15px; border-top: 1px solid #1f2a390e; background: linear-gradient(180deg, #ffffffd1, #fff 25%); }
.composer { width: min(1000px, 100%); margin: 0 auto; }
.queue-section { margin-bottom: 10px; border: 1px solid #e8edf3; border-radius: 10px; padding: 10px 12px 4px; background: #fbfcfe; }
.section-heading { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 5px; color: var(--muted); font-size: 11px; }
.section-heading strong { color: #536072; font-size: 12px; font-weight: 600; }
#queueBadge { display: inline-grid; min-width: 17px; height: 17px; margin-left: 4px; place-items: center; border-radius: 5px; background: #edf4ff; color: #527bb4; font-size: 11px; }
.queue-items { max-height: 132px; overflow: auto; scrollbar-width: thin; }
.queue-item { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid #edf0f4; }
.queue-item:last-child { border: 0; }
.queue-position { display: grid; width: 22px; height: 22px; place-items: center; border-radius: 6px; background: #f1f4f8; color: #7d8797; font: 12px Consolas, monospace; }
.queue-content { flex: 1; min-width: 0; }
.queue-prompt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #4c5666; font-size: 12px; line-height: 1.55; }
.queue-meta { display: flex; gap: 5px; margin-top: 3px; color: var(--muted); font-size: 11px; }
.remove-queue { border: 0; border-radius: 5px; background: none; width: 28px; height: 28px; color: var(--muted); padding: 6px; }
.remove-queue:hover { background: #fff0ee; color: #c46961; }
.remove-queue svg { width: 13px; height: 13px; }
.composer-box { padding: 12px 12px 9px 14px; border: 1px solid #e4e8ee; border-radius: 14px; background: #fff; box-shadow: 0 5px 18px #2633450e; }
.composer-box:focus-within { border-color: #c7d8f2; box-shadow: 0 5px 18px #3478e513; }
textarea { display: block; width: 100%; min-height: 58px; max-height: 150px; resize: vertical; border: 0; outline: 0; padding: 0; background: transparent; color: #283243; font-size: 16px; line-height: 1.7; caret-color: var(--blue); }
textarea::placeholder { color: #778293; }
.composer-actions { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 5px; }
.composer-note { color: #737e8f; font-size: 12px; }
.action-group { display: flex; align-items: center; gap: 7px; }
.stop-button, .send-button { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 36px; padding: 0 12px; border-radius: 8px; font-size: 13px; white-space: nowrap; }
.stop-button { border: 1px solid #e8ebf0; background: #fff; color: #778293; }
.stop-button:hover { background: #f7f8fa; }
.send-button { border: 1px solid var(--blue); background: var(--blue); color: #fff; font-weight: 580; }
.send-button:hover:not(:disabled) { background: #286bd4; }
.send-button:disabled { cursor: not-allowed; opacity: .43; }
.stop-button svg { width: 11px; height: 11px; }
.send-button svg { width: 13px; height: 13px; }
.composer-disclaimer { margin: 7px 0 0; color: #737e8f; text-align: center; font-size: 11px; }
.welcome-state { padding: 42px 10px; }
.welcome-state img { float: left; width: 52px; margin-right: 16px; }
.welcome-state h2 { margin: 0 0 8px; font-size: 22px; font-weight: 600; }
.welcome-state p { margin: 0; color: #667487; font-size: 14px; line-height: 1.7; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; }
@keyframes pulse { 50% { opacity: .35; } }
@media(max-width: 650px) {
  .app-shell { padding: 0; }
  .conversation { border-radius: 0; }
  .chat-header { grid-template-columns: auto minmax(0, 1fr) auto; gap: 6px; height: 56px; padding: 0 10px; }
  #sessionSelect { font-size: 14px; }
  .chat-subtitle { display: none; }
  .subtle-button, #demoControl { font-size: 11px; padding: 6px; max-width: 85px; }
  .thread { width: calc(100% - 34px); padding-top: 20px; }
  .conversation-intro { margin-bottom: 23px; }
  .user-message-wrap { max-width: 88%; }
  .user-bubble, .assistant-text { font-size: 15px; }
  .composer-wrap { padding: 10px 12px 12px; }
  .composer-box { padding: 10px 10px 8px 12px; }
  textarea { min-height: 44px; font-size: 15px; }
  .composer-note { max-width: 200px; font-size: 11px; }
  .stop-button, .send-button { width: 36px; height: 36px; padding: 0; }
  .stop-button span, .send-label { display: none; }
  .composer-disclaimer { font-size: 10px; }
  .queue-items { max-height: 100px; }
}
@media(prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; scroll-behavior: auto !important; } }
</style>
</head>
<body>
<div class="app-shell">
  <main class="conversation">
    <header class="chat-header">
      <div class="header-left"><button id="newChatButton" class="subtle-button" type="button">＋ 新对话</button></div>
      <div class="chat-heading"><select id="sessionSelect" aria-label="历史会话"></select><div class="chat-subtitle">本会话消息按顺序执行</div></div>
      <div class="header-right"><select id="demoControl" aria-label="演示控制"><option value="">演示控制</option><option value="complete">完成当前运行</option><option value="fail">模拟运行失败</option><option value="reset">重新开始演示</option></select></div>
    </header>
    <div id="chatScroll" class="chat-scroll">
      <div class="thread">
        <div class="conversation-intro"><span class="capability-pill"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 3.5h10v9H3v-9Zm2.2 2h5.6M5.2 8h5.6M5.2 10.5h3.2" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>校双高综合咨询</span><span>本地演示</span></div>
        <div id="messageList"></div>
      </div>
    </div>
    <div class="composer-wrap">
      <div class="composer">
        <section class="queue-section" id="queueSection" aria-label="等待处理的消息"><div class="section-heading"><strong>待处理 <span id="queueBadge">0</span></strong><span>按发送顺序处理</span></div><div id="queueItems" class="queue-items"></div><div id="queueEmpty" hidden></div></section>
        <form id="composerForm">
          <div class="composer-box">
            <label class="sr-only" for="messageInput">输入消息</label>
            <textarea id="messageInput" rows="2" maxlength="4000" placeholder="在此输入您想了解或办理的内容…"></textarea>
            <div class="composer-actions"><span class="composer-note" id="composerNote"></span><div class="action-group">
              <button id="stopRunButton" class="stop-button" type="button" aria-label="停止当前运行"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="4" y="4" width="8" height="8" rx="1.4" fill="currentColor"/></svg><span>停止当前</span></button>
              <button id="sendButton" class="send-button" type="submit" aria-label="发送" disabled><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 13V3m0 0L4.2 6.8M8 3l3.8 3.8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="send-label">发送</span></button>
            </div></div>
          </div>
          <p class="composer-disclaimer">演示原型 · 消息与运行记录均为本地模拟数据</p>
        </form>
      </div>
    </div>
  </main>
</div>
<div id="announcement" class="sr-only" aria-live="polite"></div>
<script>
    "use strict";
    // 只模拟业务会话与公开 SSE；不调用 Runtime、模型或私有观测接口。
    // 信封与显示规则来源：python/runtime/event_display.py、run_store.py、doc/python-api.html。
    const $ = selector => document.querySelector(selector);
    const pad = value => String(value).padStart(2, "0");
    const duration = ms => {
      const seconds = Math.max(0, Math.floor(ms / 1000));
      return (seconds >= 3600 ? pad(Math.floor(seconds / 3600)) + ":" : "") +
        pad(Math.floor(seconds / 60) % 60) + ":" + pad(seconds % 60);
    };
    const time = ms => new Date(ms).toLocaleTimeString("zh-CN", { hour12: false });
    const setText = (selector, value) => { $(selector).textContent = value; };
    const terminal = run => ["completed", "cancelled", "failed"].includes(run.status);
    const storageKey = "scribe-conversation-prototype-v2";
    const phaseNames = {
      queued: "等待处理", preparing_files: "正在准备附件", files_ready: "",
      model_starting: "正在处理", thinking: "正在思考", saving_files: "正在保存文件"
    };
    const eventNames = {
      "run.started": "正在处理", "run.completed": "已完成", "run.failed": "执行失败",
      "run.cancelled": "已停止", "message.delta": "", "artifact.pending": "等待上传",
      "artifact.uploading": "正在上传", "artifact.ready": "文件已保存"
    };
    const toolNames = { "data.query": "查询业务数据", "document.process": "处理文档" };
    const statusNames = { queued: "排队中", running: "正在运行", completed: "已完成", cancelled: "已停止", failed: "执行失败" };
    let store = { sessions: [], currentId: "" };
    let composing = false;

    const current = () => store.sessions.find(session => session.id === store.currentId);
    const active = session => session.runs.find(run => run.runId === session.activeId);
    const element = (tag, className, value) => {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (value !== undefined) node.textContent = value;
      return node;
    };
    function button(label, className, handler) {
      const node = element("button", className, label);
      node.type = "button";
      node.addEventListener("click", handler);
      return node;
    }
    function announce(message) { setText("#announcement", message); }
    function save() {
      try { localStorage.setItem(storageKey, JSON.stringify(store)); }
      catch { setText(".composer-disclaimer", "本地模拟 · 浏览器存储不可用，关闭页面后记录将丢失"); }
    }
    function newSession(title) {
      const session = {
        id: "session_" + crypto.randomUUID(), title, runs: [],
        queue: [], activeId: null
      };
      store.sessions.push(session);
      store.currentId = session.id;
      return session;
    }

    // 所有消息正文由 message.delta 追加；空 displayName 不补造工具/阶段状态。
    // 按 Run 独立去重并按 sequence 回看。公开工具名称不会包含内部 toolName/参数/结果。
    function append(run, type, payload = {}, occurredAt = Date.now()) {
      const sequence = run.events.length + 1;
      const displayName = type === "phase" ? phaseNames[payload.name] ?? "" :
        type.startsWith("tool.") ? toolNames[payload.toolKey] ?? "" : eventNames[type] ?? "";
      const event = {
        protocolVersion: "agent-events/v1", runId: run.runId, sequence,
        eventId: "evt_" + run.shortId + "_" + pad(sequence),
        occurredAt, type, payload: { ...payload, displayName }
      };
      if (run.events.some(item => item.eventId === event.eventId || item.sequence === sequence)) return;
      run.events.push(event);
      if (type === "message.delta") run.answer += payload.textDelta;
      if (type.startsWith("artifact.")) run.artifact = { ...payload, displayName };
    }

    function scenario(prompt) {
      if (/简报|正式|文档/.test(prompt)) return {
        kind: "document", toolKey: "document.process",
        chunks: [
          "我会沿用前面的年度对比结论，按“总体进展—阶段成果—后续关注项”的结构整理简报。\n\n",
          "示例简报已整理完成。正式使用时，需继续核验数据来源、统计口径与文稿内容。"
        ],
        artifact: "双高建设年度进展简报.pdf"
      };
      if (/学院|差异/.test(prompt)) return {
        kind: "query", toolKey: "data.query",
        chunks: [
          "本轮将按二级学院归纳完成情况，并将统计口径不一致的指标单独标记。\n\n",
          "示例分析已整理：对比时应同时查看任务完成进度、年度目标与证据完整性，不直接用不同口径的数值排序。"
        ]
      };
      if (/2023|2025|年度|目标/.test(prompt)) return {
        kind: "query", toolKey: "data.query",
        chunks: [
          "我会按年度对齐建设目标、统计口径和成果证据，再整理三年的进展变化。\n\n",
          "示例对比已完成：先概括各年的阶段成果，再列出延续任务与需要补充证据的指标。"
        ]
      };
      return {
        kind: "query", toolKey: "data.query",
        chunks: [
          "已开始处理这条消息。\n\n",
          "这是本地原型的示例回复，用于体验串行执行、停止、计时和事件回看；实际内容将在接入服务后生成。"
        ]
      };
    }
    function makeRun(prompt, submittedAt) {
      const id = crypto.randomUUID().replaceAll("-", "").slice(0, 10);
      const run = {
        runId: "run_" + id, shortId: id, prompt, submittedAt, startedAt: null,
        endedAt: null, status: "queued", events: [], answer: "", cursor: 0,
        scenario: scenario(prompt), artifact: null, expanded: false
      };
      // Python Client 实现先发 run.started，再发 phase.queued；不能把前者当作已开始模型执行。
      append(run, "run.started", { status: "running" }, submittedAt);
      append(run, "phase", { name: "queued" }, submittedAt + 1);
      return run;
    }
    function steps(run) {
      const type = run.scenario.toolKey;
      const call = { toolCallId: "call_" + run.shortId, toolKey: type, scope: "main" };
      const result = [
        [1200, "phase", { name: "thinking", visible: true }],
        [4500, "tool.started", { ...call, status: "started" }],
        [12500, "tool.progress", { ...call, status: "running" }],
        [21000, "tool.finished", { ...call, status: "finished", isError: false }],
        [24500, "phase", { name: "thinking", visible: true }],
        [28000, "message.delta", { textDelta: run.scenario.chunks[0] }],
        [35000, "message.delta", { textDelta: run.scenario.chunks[1] }]
      ];
      if (run.scenario.artifact) {
        const file = { artifactId: "artifact_" + run.shortId, name: run.scenario.artifact, size: 68420, suffix: "pdf" };
        result.push(
          [37000, "artifact.pending", { ...file, status: "pending" }],
          [38500, "phase", { name: "saving_files" }],
          [39500, "artifact.uploading", { ...file, status: "uploading" }],
          [43000, "artifact.ready", { ...file, fileId: "file_demo_" + run.shortId, status: "ready" }]
        );
      }
      return result;
    }

    function startNext(session, now = Date.now()) {
      if (active(session) || !session.queue.length) return;
      const runId = session.queue.shift();
      const run = session.runs.find(item => item.runId === runId);
      run.status = "running";
      run.startedAt = now;
      session.activeId = run.runId;
      // 原型的“已执行”从首个执行阶段计时；排队时间另算，不读取私有 Timing。
      append(run, "phase", { name: "model_starting" }, now);
    }
    function enqueue(session, prompt, now = Date.now()) {
      const run = makeRun(prompt, now);
      session.runs.push(run);
      session.queue.push(run.runId);
      if (session.title === "新对话") session.title = prompt.slice(0, 24);
      startNext(session, now + 2);
      return run;
    }
    function advance(run, now) {
      const script = steps(run);
      while (run.cursor < script.length && now >= run.startedAt + script[run.cursor][0]) {
        const [offset, type, payload] = script[run.cursor++];
        append(run, type, payload, run.startedAt + offset);
      }
    }
    function finish(session, run, status, now = Date.now()) {
      if (terminal(run)) return;
      run.status = status;
      run.endedAt = now;
      run.expanded = false;
      append(run, "run." + status, status === "failed" ?
        { code: "timeout", message: "本次处理超时，请稍后重试。" } : {}, now);
      session.queue = session.queue.filter(id => id !== run.runId);
      if (session.activeId === run.runId) session.activeId = null;
      // 完成、失败、停止均释放当前会话，下一条只在终态之后进入执行阶段。
      startNext(session, now + 2);
      save();
    }
    function cancelQueued(runId) {
      const session = current();
      const run = session.runs.find(item => item.runId === runId);
      if (!run || run.status !== "queued") return;
      finish(session, run, "cancelled");
      refresh();
      announce("已取消这条排队消息。");
    }
    function tick() {
      let changed = false;
      const now = Date.now();
      store.sessions.forEach(session => {
        const run = active(session);
        if (!run) return;
        const before = run.events.length;
        advance(run, now);
        if (now >= run.startedAt + 45000) finish(session, run, "completed", run.startedAt + 45000);
        changed ||= before !== run.events.length;
      });
      if (changed) { save(); refresh(); }
      updateClocks();
    }

    function seedDemo() {
      store = { sessions: [], currentId: "" };
      const now = Date.now();
      const session = newSession("校双高建设进展分析");
      const previous = enqueue(session, "总结近期建设项目的主要进展。", now - 180000);
      previous.scenario.chunks = [
        "我会从目标进度、阶段成果和后续关注项三个方面梳理。\n\n",
        "可以继续指定年度或学院范围，我会在当前会话中衔接分析。"
      ];
      advance(previous, previous.startedAt + 45000);
      finish(session, previous, "completed", previous.startedAt + 45000);
      const live = enqueue(session, "请对比学校2023—2025年双高建设目标完成情况，提炼年度进展。", now - 8000);
      advance(live, now);
      enqueue(session, "再看一下校内各二级学院的完成情况，标出差异较大的指标。", now - 5500);
      enqueue(session, "请把年度对比结论整理成一份正式简报。", now - 2200);
      save();
      refresh(true);
    }
    function restore() {
      try {
        const data = JSON.parse(localStorage.getItem(storageKey));
        if (!data || !Array.isArray(data.sessions) || !data.sessions.length ||
            !data.sessions.every(session => Array.isArray(session.runs) && Array.isArray(session.queue)) ||
            !data.sessions.some(session => session.id === data.currentId)) return false;
        store = data;
        // 恢复本地模拟状态；原始事件时间戳不改写，由 tick 推进尚未完成的演示。
        return true;
      } catch { return false; }
    }

    function currentActivity(run) {
      if (terminal(run)) return statusNames[run.status];
      if (!run.startedAt) return "等待处理";
      const calls = new Map();
      for (const event of run.events) {
        if (event.type.startsWith("tool.")) calls.set(event.payload.scope + ":" + event.payload.toolCallId, event);
      }
      const executing = Array.from(calls.values()).find(event =>
        event.type !== "tool.finished" && event.payload.displayName);
      if (executing) return executing.payload.displayName;
      return run.events.slice().reverse().find(event =>
        event.type === "phase" && event.payload.displayName && event.payload.name !== "queued")?.payload.displayName || "正在处理";
    }
    function humanDuration(ms) {
      const seconds = Math.max(0, Math.floor(ms / 1000));
      return Math.floor(seconds / 3600) + "小时" + pad(Math.floor(seconds / 60) % 60) + "分" + pad(seconds % 60) + "秒";
    }
    function renderMessages() {
      const list = $("#messageList");
      list.replaceChildren();
      const runs = current().runs.filter(run => run.startedAt !== null || terminal(run));
      if (!runs.length) {
        const welcome = element("div", "welcome-state");
        const mark = element("img");
        mark.src = "assets/ai-icon.png";
        mark.alt = "";
        welcome.append(mark, element("h2", "", "你好，我是师创智能体"), element("p", "", "输入一条消息开始体验，运行时可以继续发送，消息会依次处理。"));
        list.append(welcome);
      }
      for (const run of runs) {
        const turn = element("section", "turn");
        turn.dataset.run = run.runId;
        const user = element("div", "user-message");
        const userWrap = element("div", "user-message-wrap");
        userWrap.append(element("div", "user-bubble", run.prompt), element("div", "message-hint", time(run.submittedAt)));
        user.append(userWrap);
        turn.append(user);
        const reply = element("article", "assistant-message");
        const mark = element("img", "assistant-mark");
        mark.src = "assets/ai-icon.png";
        mark.alt = "";
        const assistant = element("div", "assistant-content");
        assistant.append(element("div", "assistant-label", "师创智能体"));
        const clock = element("div", "processing-time");
        clock.dataset.clockRun = run.runId;
        assistant.append(clock);
        const process = element("details", "run-process");
        const running = run.status === "running";
        process.open = running || run.expanded === true;
        const summary = element("summary", "process-summary");
        summary.append(element("span", running ? "status-dot active" : "status-dot"),
          element("span", "", running ? currentActivity(run) : !run.startedAt ? "已取消排队" : statusNames[run.status]),
          element("span", "chevron", "›"));
        summary.addEventListener("click", event => {
          // 运行期间始终展示节点；终态后允许回看，下一轮不会影响上一轮展开状态。
          if (run.status === "running") event.preventDefault();
        });
        process.addEventListener("toggle", () => {
          if (process.isConnected && terminal(run)) { run.expanded = process.open; save(); }
        });
        process.append(summary);
        const timeline = element("ol", "inline-timeline");
        timeline.setAttribute("aria-label", "处理过程");
        // 当前只呈现 Python 公开标题；不展开 Run 信封、工具参数或执行详情。
        for (const event of run.events.filter(event => event.payload.displayName)) {
          const row = element("li", "timeline-node");
          row.append(element("span", "node-dot"), element("span", "node-label", event.payload.displayName));
          timeline.append(row);
        }
        process.append(timeline);
        assistant.append(process);
        // 回答增量仍按公共事件保存；本原型在终态后才呈现正文。
        if (terminal(run)) {
          if (run.answer) assistant.append(element("div", "assistant-text", run.answer));
          if (run.status === "cancelled" || run.status === "failed") {
            assistant.append(element("div", "terminal-note " + run.status,
              run.status === "failed" ? "本次处理超时，已保留收到的内容。" : run.startedAt ? "已停止，已生成的内容仍保留。" : "消息已取消，未开始执行。"));
            if (run.status === "failed") assistant.append(button("重新排队", "retry-button", () => {
              enqueue(current(), run.prompt); save(); refresh(true); announce("已重新加入队列。");
            }));
          }
          if (run.artifact) {
            const file = element("div", "file-chip");
            file.append(element("span", "file-icon", "PDF"), element("span", "", run.artifact.name), element("small", "", run.artifact.displayName + " · 示例文件"));
            assistant.append(file);
          }
        }
        reply.append(mark, assistant);
        turn.append(reply);
        list.append(turn);
      }
    }
    function renderQueue() {
      const session = current();
      const list = $("#queueItems");
      list.replaceChildren();
      $("#queueEmpty").hidden = session.queue.length !== 0;
      for (const [index, id] of session.queue.entries()) {
        const run = session.runs.find(item => item.runId === id);
        const row = element("div", "queue-item");
        row.append(element("span", "queue-position", pad(index + 1)));
        const content = element("div", "queue-content");
        content.append(element("div", "queue-prompt", run.prompt));
        const meta = element("div", "queue-meta");
        meta.append(element("span", "queue-state", index ? "等待中" : "下一条"),
          element("span", "", "·"), element("span", "queue-wait", duration(Date.now() - run.submittedAt)),
          element("span", "", "已排队"));
        meta.dataset.queueRun = id;
        content.append(meta);
        const remove = button("", "remove-queue", () => cancelQueued(id));
        remove.setAttribute("aria-label", "取消队列第 " + (index + 1) + " 条消息");
        remove.title = "取消排队";
        remove.innerHTML = '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="m4 4 8 8m0-8-8 8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>';
        row.append(content, remove);
        list.append(row);
      }
    }
    function renderSessions() {
      const select = $("#sessionSelect");
      select.replaceChildren();
      store.sessions.slice().reverse().forEach(session => {
        const option = element("option", "", session.title);
        option.value = session.id;
        select.append(option);
      });
      select.value = store.currentId;
    }
    function refresh(bottom = false) {
      const scroller = $("#chatScroll");
      const wasBottom = scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight < 80;
      const oldTop = scroller.scrollTop;
      renderSessions();
      renderMessages();
      renderQueue();
      updateClocks();
      // 队列改变可视高度，待整页布局更新后再定位，避免最新节点落在输入框下方。
      scroller.scrollTop = bottom || wasBottom ? scroller.scrollHeight : oldTop;
    }
    function updateClocks() {
      const session = current();
      const running = active(session);
      const now = Date.now();
      $("#queueSection").hidden = session.queue.length === 0;
      setText("#queueBadge", String(session.queue.length));
      $("#stopRunButton").hidden = !running;
      $("#sendButton").setAttribute("aria-label", running ? "加入队列" : "发送");
      setText(".send-label", running ? "加入队列" : "发送");
      $("#sendButton").disabled = !$("#messageInput").value.trim();
      setText("#composerNote", running ? session.queue.length + " 条排队 · 当前处理结束后依次发送" : "Enter 发送 · Shift + Enter 换行");
      $("#messageInput").placeholder = running ? "继续补充问题，发送后按顺序处理…" : "在此输入您想了解或办理的内容…";
      document.querySelectorAll("[data-clock-run]").forEach(node => {
        const run = session.runs.find(item => item.runId === node.dataset.clockRun);
        node.textContent = run.startedAt ? "已处理 " + humanDuration((run.endedAt || now) - run.startedAt) :
          "已等待 " + humanDuration((run.endedAt || now) - run.submittedAt);
      });
      document.querySelectorAll("[data-queue-run]").forEach(node => {
        const run = session.runs.find(item => item.runId === node.dataset.queueRun);
        node.querySelector(".queue-wait").textContent = duration(now - run.submittedAt);
      });
    }
    $("#composerForm").addEventListener("submit", event => {
      event.preventDefault();
      const input = $("#messageInput");
      const prompt = input.value.trim();
      if (!prompt || composing) return;
      enqueue(current(), prompt);
      input.value = "";
      save(); refresh(true);
      announce(active(current()) ? "消息已提交，同一会话按顺序执行。" : "消息已发送。");
    });
    $("#messageInput").addEventListener("input", updateClocks);
    $("#messageInput").addEventListener("compositionstart", () => { composing = true; });
    $("#messageInput").addEventListener("compositionend", () => { composing = false; });
    $("#messageInput").addEventListener("keydown", event => {
      if (event.key === "Enter" && !event.shiftKey && !event.isComposing && !composing && event.keyCode !== 229) {
        event.preventDefault(); $("#composerForm").requestSubmit();
      }
    });
    $("#stopRunButton").addEventListener("click", () => {
      const run = active(current());
      if (!run) return;
      finish(current(), run, "cancelled");
      refresh();
      announce("当前运行已停止，下一条排队消息继续执行。");
    });
    $("#sessionSelect").addEventListener("change", event => {
      store.currentId = event.target.value; save(); refresh(true);
    });
    $("#newChatButton").addEventListener("click", () => {
      newSession("新对话"); save(); refresh(true); $("#messageInput").focus();
    });
    $("#demoControl").addEventListener("change", event => {
      const action = event.target.value;
      event.target.value = "";
      if (action === "reset") { seedDemo(); announce("已重置本地演示记录。"); return; }
      const run = active(current());
      if (!run) { announce("当前没有正在运行的消息。"); return; }
      if (action === "complete") {
        const now = Date.now();
        // 快速演示只缩短尚未发生步骤的等待，不改写已记录的时间戳。
        const script = steps(run);
        while (run.cursor < script.length) {
          const [, type, payload] = script[run.cursor++];
          append(run, type, payload, now);
        }
        finish(current(), run, "completed", now);
      }
      if (action === "fail") finish(current(), run, "failed");
      refresh();
    });
    if (!restore()) seedDemo(); else refresh(true);
    window.setInterval(tick, 250);
  </script>
</body>
</html>
