<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>师创智能体 · 会话运行原型</title>
<link rel="icon" href="assets/ai-icon.png">
<style>
:root { color-scheme: light; font-family: -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif; color:#282828; background:#fff; }
* { box-sizing:border-box; }
body { margin:0; height:100dvh; overflow:hidden; font-size:14px; }
button,textarea,select { font:inherit; color:inherit; }
button,summary,select { -webkit-tap-highlight-color:transparent; }
button { cursor:pointer; }
button:focus-visible,summary:focus-visible,select:focus-visible,textarea:focus-visible { outline:2px solid #808080; outline-offset:3px; }
[hidden] { display:none!important; }
.app-shell { height:100%; display:flex; flex-direction:column; }
.chat-header { flex-shrink:0; min-height:64px; padding:14px 24px; display:flex; align-items:center; justify-content:space-between; gap:16px; }
.header-left,.header-right { display:flex; align-items:center; gap:14px; min-width:0; }
.brand { font-weight:600; font-size:16px; white-space:nowrap; }
#sessionSelect { max-width:360px; border:0; background:transparent; color:#737373; text-overflow:ellipsis; padding:6px; }
.subtle-button,#demoControl { border:1px solid #e7e7e7; background:white; border-radius:8px; padding:7px 10px; font-size:12px; }
.subtle-button:hover,#demoControl:hover { background:#f7f7f7; }
.chat-scroll { flex:1; min-height:0; overflow:auto; scrollbar-width:thin; }
.thread { width:min(800px,calc(100% - 64px)); margin:0 auto; padding:40px 0 32px; }
.turn { margin-bottom:42px; }
.user-message { display:flex; justify-content:flex-end; margin-bottom:30px; }
.user-bubble { max-width:85%; padding:12px 18px; background:#f3f3f3; border-radius:20px; font-size:15px; line-height:1.7; white-space:pre-wrap; overflow-wrap:anywhere; }
.assistant-content { width:100%; }
.processing-time { color:#8a8a8a; font-size:12px; margin-bottom:11px; font-variant-numeric:tabular-nums; }
.process-summary { list-style:none; display:flex; align-items:center; gap:9px; width:fit-content; padding:3px 0; color:#737373; cursor:pointer; font-size:14px; }
summary::-webkit-details-marker { display:none; }
.status-dot { width:7px; height:7px; border-radius:50%; background:#aaa; flex-shrink:0; }
.status-dot.active { background:#707070; animation:pulse 1.6s ease-in-out infinite; }
.process-count { color:#999; font-size:12px; margin-left:4px; }
.chevron { margin-left:3px; display:inline-block; transform:rotate(0); font-size:18px; line-height:14px; }
.run-process[open] > summary .chevron { transform:rotate(90deg); }
.inline-timeline { margin:17px 0 22px 3px; }
.timeline-node { position:relative; padding:0 0 17px 21px; border-left:1px solid #e4e4e4; }
.timeline-node:last-child { padding-bottom:1px; border-left-color:transparent; }
.node-summary { list-style:none; display:flex; gap:16px; align-items:baseline; cursor:pointer; color:#777; font-size:13px; line-height:1.6; }
.node-dot { position:absolute; left:-3.5px; top:7px; width:6px; height:6px; border-radius:50%; background:#bbb; box-shadow:0 0 0 4px white; }
.node-label { flex:1; }
.node-time { font-size:11px; color:#a0a0a0; font-variant-numeric:tabular-nums; }
.event-json { max-height:240px; overflow:auto; padding:12px; background:#f7f7f7; border:1px solid #eee; border-radius:8px; font:11px/1.6 Consolas,monospace; color:#666; white-space:pre-wrap; overflow-wrap:anywhere; }
.assistant-text { font-size:15px; line-height:1.9; white-space:pre-wrap; overflow-wrap:anywhere; margin-top:22px; }
.terminal-note { color:#888; font-size:13px; margin-top:18px; }
.terminal-note.failed { color:#ac4a3b; }
.retry-button { margin-top:12px; padding:6px 12px; border:1px solid #ddd; background:white; border-radius:8px; font-size:12px; }
.file-chip { margin-top:18px; display:flex; align-items:center; gap:12px; width:fit-content; flex-wrap:wrap; border:1px solid #e7e7e7; padding:14px; border-radius:12px; }
.file-icon { color:#b26755; font-size:11px; }
.file-chip small { color:#999; }
.composer-wrap { flex-shrink:0; width:min(800px,calc(100% - 64px)); margin:0 auto; padding:0 0 15px; background:#fff; }
.queue-section { margin-bottom:10px; border:1px solid #e8e8e8; border-radius:14px; padding:12px 15px 5px; background:#fafafa; }
.section-heading { display:flex; align-items:center; justify-content:space-between; font-size:12px; color:#888; margin-bottom:4px; }
.section-heading strong { font-weight:500; color:#626262; }
.queue-items { max-height:132px; overflow:auto; scrollbar-width:thin; }
.queue-item { display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid #ededed; }
.queue-item:last-child { border:0; }
.queue-position { color:#aaa; font-size:11px; }
.queue-content { flex:1; min-width:0; }
.queue-prompt { display:block; width:100%; border:0; background:none; text-align:left; padding:0; font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.queue-meta { display:flex; gap:5px; color:#999; font-size:10px; margin-top:4px; }
.remove-queue { border:0; background:none; width:28px; height:28px; color:#999; padding:6px; }
.remove-queue svg { width:16px; height:16px; }
.composer-box { border:1px solid #e1e1e1; border-radius:22px; padding:15px 16px 10px; background:#fafafa; box-shadow:0 2px 8px #00000003; }
textarea { display:block; resize:none; border:0; outline:none; background:none; width:100%; min-height:52px; max-height:180px; font-size:15px; line-height:1.6; }
textarea::placeholder { color:#999; }
.composer-actions { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:9px; }
.composer-note { color:#999; font-size:11px; }
.action-group { display:flex; gap:8px; align-items:center; }
.stop-button { border:1px solid #ddd; background:white; padding:7px 10px; border-radius:20px; font-size:11px; }
.send-button { width:32px; height:32px; border:0; border-radius:50%; background:#282828; color:#fff; font-size:22px; line-height:1; }
.send-button:disabled { background:#dedede; color:#fff; cursor:default; }
.composer-disclaimer { text-align:center; color:#aaa; font-size:10px; margin:9px 0 0; }
.welcome-state { margin-top:15vh; }
.welcome-state h2 { font-size:26px; font-weight:500; }
.welcome-state p { color:#888; line-height:1.7; }
.sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; }
@keyframes pulse { 50% { opacity:.35; } }
@media(max-width:650px) { .chat-header { padding:12px 16px; gap:8px; } .brand { font-size:14px; } #sessionSelect { max-width:130px; font-size:11px; } .header-left { gap:5px; } .header-right { gap:5px; } .subtle-button,#demoControl { font-size:10px; padding:6px; max-width:84px; } .thread { width:calc(100% - 36px); padding-top:25px; } .composer-wrap { width:calc(100% - 24px); } .user-bubble { max-width:92%; } .composer-note { max-width:200px; font-size:10px; } .node-time { font-size:10px; } }
@media(prefers-reduced-motion:reduce) { * { animation:none!important; scroll-behavior:auto!important; } }
</style>
</head>
<body>
<main class="app-shell">
  <header class="chat-header">
    <div class="header-left"><span class="brand">师创智能体</span><select id="sessionSelect" aria-label="历史会话"></select></div>
    <div class="header-right"><button id="newChatButton" class="subtle-button" type="button">新对话</button><select id="demoControl" aria-label="演示控制"><option value="">演示控制</option><option value="complete">完成当前运行</option><option value="fail">模拟运行失败</option><option value="reset">重新开始演示</option></select></div>
  </header>
  <div id="chatScroll" class="chat-scroll"><div class="thread"><div id="messageList"></div></div></div>
  <div class="composer-wrap">
    <section class="queue-section" id="queueSection" aria-label="等待处理的消息"><div class="section-heading"><strong>待处理 <span id="queueBadge">0</span></strong><span>按发送顺序处理</span></div><div id="queueItems" class="queue-items"></div><div id="queueEmpty" hidden></div></section>
    <form id="composerForm"><div class="composer-box"><label class="sr-only" for="messageInput">输入消息</label><textarea id="messageInput" rows="2" maxlength="4000" placeholder="发送消息…"></textarea><div class="composer-actions"><span class="composer-note" id="composerNote"></span><div class="action-group"><button id="stopRunButton" class="stop-button" type="button">■ 停止</button><button id="sendButton" class="send-button" type="submit" aria-label="发送" disabled>↑</button></div></div></div><p class="composer-disclaimer">本地交互原型 · 事件格式沿用 Python，消息与执行均为模拟</p></form>
  </div>
</main>
<div id="announcement" class="sr-only" aria-live="polite"></div>
<script>
    "use strict";
    // 只模拟业务会话与公开 SSE；不调用 Runtime、模型或私有观测接口。
    // 信封与显示规则来源：python/runtime/event_display.py、run_store.py、doc/python-api.html。
    const $ = selector => document.querySelector(selector);
    const pad = value => String(value).padStart(2, "0");
    const duration = ms => {
      const seconds = Math.max(0, Math.floor(ms / 1000));
      return (seconds >= 3600 ? pad(Math.floor(seconds / 3600)) + ":" : "") +
        pad(Math.floor(seconds / 60) % 60) + ":" + pad(seconds % 60);
    };
    const time = ms => new Date(ms).toLocaleTimeString("zh-CN", { hour12: false });
    const setText = (selector, value) => { $(selector).textContent = value; };
    const terminal = run => ["completed", "cancelled", "failed"].includes(run.status);
    const storageKey = "scribe-conversation-prototype-v2";
    const phaseNames = {
      queued: "等待处理", preparing_files: "正在准备附件", files_ready: "",
      model_starting: "正在处理", thinking: "正在思考", saving_files: "正在保存文件"
    };
    const eventNames = {
      "run.started": "正在处理", "run.completed": "已完成", "run.failed": "执行失败",
      "run.cancelled": "已停止", "message.delta": "", "artifact.pending": "等待上传",
      "artifact.uploading": "正在上传", "artifact.ready": "文件已保存"
    };
    const toolNames = { "data.query": "查询业务数据", "document.process": "处理文档" };
    const statusNames = { queued: "排队中", running: "正在运行", completed: "已完成", cancelled: "已停止", failed: "执行失败" };
    let store = { sessions: [], currentId: "" };
    let composing = false;

    const current = () => store.sessions.find(session => session.id === store.currentId);
    const active = session => session.runs.find(run => run.runId === session.activeId);
    const element = (tag, className, value) => {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (value !== undefined) node.textContent = value;
      return node;
    };
    function button(label, className, handler) {
      const node = element("button", className, label);
      node.type = "button";
      node.addEventListener("click", handler);
      return node;
    }
    function announce(message) { setText("#announcement", message); }
    function save() {
      try { localStorage.setItem(storageKey, JSON.stringify(store)); }
      catch { setText(".composer-disclaimer", "本地模拟 · 浏览器存储不可用，关闭页面后记录将丢失"); }
    }
    function newSession(title) {
      const session = {
        id: "session_" + crypto.randomUUID(), title, runs: [],
        queue: [], activeId: null
      };
      store.sessions.push(session);
      store.currentId = session.id;
      return session;
    }

    // 所有消息正文由 message.delta 追加；空 displayName 不补造工具/阶段状态。
    // 按 Run 独立去重并按 sequence 回看。公开工具名称不会包含内部 toolName/参数/结果。
    function append(run, type, payload = {}, occurredAt = Date.now()) {
      const sequence = run.events.length + 1;
      const displayName = type === "phase" ? phaseNames[payload.name] ?? "" :
        type.startsWith("tool.") ? toolNames[payload.toolKey] ?? "" : eventNames[type] ?? "";
      const event = {
        protocolVersion: "agent-events/v1", runId: run.runId, sequence,
        eventId: "evt_" + run.shortId + "_" + pad(sequence),
        occurredAt, type, payload: { ...payload, displayName }
      };
      if (run.events.some(item => item.eventId === event.eventId || item.sequence === sequence)) return;
      run.events.push(event);
      if (type === "message.delta") run.answer += payload.textDelta;
      if (type.startsWith("artifact.")) run.artifact = { ...payload, displayName };
    }

    function scenario(prompt) {
      if (/简报|正式|文档/.test(prompt)) return {
        kind: "document", toolKey: "document.process",
        chunks: [
          "我会沿用前面的年度对比结论，按“总体进展—阶段成果—后续关注项”的结构整理简报。\n\n",
          "示例简报已整理完成。正式使用时，需继续核验数据来源、统计口径与文稿内容。"
        ],
        artifact: "双高建设年度进展简报.pdf"
      };
      if (/学院|差异/.test(prompt)) return {
        kind: "query", toolKey: "data.query",
        chunks: [
          "本轮将按二级学院归纳完成情况，并将统计口径不一致的指标单独标记。\n\n",
          "示例分析已整理：对比时应同时查看任务完成进度、年度目标与证据完整性，不直接用不同口径的数值排序。"
        ]
      };
      if (/2023|2025|年度|目标/.test(prompt)) return {
        kind: "query", toolKey: "data.query",
        chunks: [
          "我会按年度对齐建设目标、统计口径和成果证据，再整理三年的进展变化。\n\n",
          "示例对比已完成：先概括各年的阶段成果，再列出延续任务与需要补充证据的指标。"
        ]
      };
      return {
        kind: "query", toolKey: "data.query",
        chunks: [
          "已开始处理这条消息。\n\n",
          "这是本地原型的示例回复，用于体验串行执行、停止、计时和事件回看；实际内容将在接入服务后生成。"
        ]
      };
    }
    function makeRun(prompt, submittedAt) {
      const id = crypto.randomUUID().replaceAll("-", "").slice(0, 10);
      const run = {
        runId: "run_" + id, shortId: id, prompt, submittedAt, startedAt: null,
        endedAt: null, status: "queued", events: [], answer: "", cursor: 0,
        scenario: scenario(prompt), artifact: null, expanded: false
      };
      // Python Client 实现先发 run.started，再发 phase.queued；不能把前者当作已开始模型执行。
      append(run, "run.started", { status: "running" }, submittedAt);
      append(run, "phase", { name: "queued" }, submittedAt + 1);
      return run;
    }
    function steps(run) {
      const type = run.scenario.toolKey;
      const call = { toolCallId: "call_" + run.shortId, toolKey: type, scope: "main" };
      const result = [
        [1200, "phase", { name: "thinking", visible: true }],
        [4500, "tool.started", { ...call, status: "started" }],
        [12500, "tool.progress", { ...call, status: "running" }],
        [21000, "tool.finished", { ...call, status: "finished", isError: false }],
        [24500, "phase", { name: "thinking", visible: true }],
        [28000, "message.delta", { textDelta: run.scenario.chunks[0] }],
        [35000, "message.delta", { textDelta: run.scenario.chunks[1] }]
      ];
      if (run.scenario.artifact) {
        const file = { artifactId: "artifact_" + run.shortId, name: run.scenario.artifact, size: 68420, suffix: "pdf" };
        result.push(
          [37000, "artifact.pending", { ...file, status: "pending" }],
          [38500, "phase", { name: "saving_files" }],
          [39500, "artifact.uploading", { ...file, status: "uploading" }],
          [43000, "artifact.ready", { ...file, fileId: "file_demo_" + run.shortId, status: "ready" }]
        );
      }
      return result;
    }

    function startNext(session, now = Date.now()) {
      if (active(session) || !session.queue.length) return;
      const runId = session.queue.shift();
      const run = session.runs.find(item => item.runId === runId);
      run.status = "running";
      run.startedAt = now;
      session.activeId = run.runId;
      // 原型的“已执行”从首个执行阶段计时；排队时间另算，不读取私有 Timing。
      append(run, "phase", { name: "model_starting" }, now);
    }
    function enqueue(session, prompt, now = Date.now()) {
      const run = makeRun(prompt, now);
      session.runs.push(run);
      session.queue.push(run.runId);
      if (session.title === "新对话") session.title = prompt.slice(0, 24);
      startNext(session, now + 2);
      return run;
    }
    function advance(run, now) {
      const script = steps(run);
      while (run.cursor < script.length && now >= run.startedAt + script[run.cursor][0]) {
        const [offset, type, payload] = script[run.cursor++];
        append(run, type, payload, run.startedAt + offset);
      }
    }
    function finish(session, run, status, now = Date.now()) {
      if (terminal(run)) return;
      run.status = status;
      run.endedAt = now;
      run.expanded = false;
      append(run, "run." + status, status === "failed" ?
        { code: "timeout", message: "本次处理超时，请稍后重试。" } : {}, now);
      session.queue = session.queue.filter(id => id !== run.runId);
      if (session.activeId === run.runId) session.activeId = null;
      // 完成、失败、停止均释放当前会话，下一条只在终态之后进入执行阶段。
      startNext(session, now + 2);
      save();
    }
    function cancelQueued(runId) {
      const session = current();
      const run = session.runs.find(item => item.runId === runId);
      if (!run || run.status !== "queued") return;
      finish(session, run, "cancelled");
      refresh();
      announce("已取消这条排队消息。");
    }
    function tick() {
      let changed = false;
      const now = Date.now();
      store.sessions.forEach(session => {
        const run = active(session);
        if (!run) return;
        const before = run.events.length;
        advance(run, now);
        if (now >= run.startedAt + 45000) finish(session, run, "completed", run.startedAt + 45000);
        changed ||= before !== run.events.length;
      });
      if (changed) { save(); refresh(); }
      updateClocks();
    }

    function seedDemo() {
      store = { sessions: [], currentId: "" };
      const now = Date.now();
      const session = newSession("校双高建设进展分析");
      const previous = enqueue(session, "总结近期建设项目的主要进展。", now - 180000);
      previous.scenario.chunks = [
        "我会从目标进度、阶段成果和后续关注项三个方面梳理。\n\n",
        "可以继续指定年度或学院范围，我会在当前会话中衔接分析。"
      ];
      advance(previous, previous.startedAt + 45000);
      finish(session, previous, "completed", previous.startedAt + 45000);
      const live = enqueue(session, "请对比学校2023—2025年双高建设目标完成情况，提炼年度进展。", now - 8000);
      advance(live, now);
      enqueue(session, "再看一下校内各二级学院的完成情况，标出差异较大的指标。", now - 5500);
      enqueue(session, "请把年度对比结论整理成一份正式简报。", now - 2200);
      save();
      refresh(true);
    }
    function restore() {
      try {
        const data = JSON.parse(localStorage.getItem(storageKey));
        if (!data || !Array.isArray(data.sessions) || !data.sessions.length ||
            !data.sessions.every(session => Array.isArray(session.runs) && Array.isArray(session.queue)) ||
            !data.sessions.some(session => session.id === data.currentId)) return false;
        store = data;
        // 恢复本地模拟状态；原始事件时间戳不改写，由 tick 推进尚未完成的演示。
        return true;
      } catch { return false; }
    }

    function currentActivity(run) {
      if (terminal(run)) return statusNames[run.status];
      if (!run.startedAt) return "等待处理";
      const calls = new Map();
      for (const event of run.events) {
        if (event.type.startsWith("tool.")) calls.set(event.payload.scope + ":" + event.payload.toolCallId, event);
      }
      const executing = Array.from(calls.values()).find(event =>
        event.type !== "tool.finished" && event.payload.displayName);
      if (executing) return executing.payload.displayName;
      return run.events.slice().reverse().find(event =>
        event.type === "phase" && event.payload.displayName && event.payload.name !== "queued")?.payload.displayName || "正在处理";
    }
    function humanDuration(ms) {
      const seconds = Math.max(0, Math.floor(ms / 1000));
      return Math.floor(seconds / 3600) + "小时" + pad(Math.floor(seconds / 60) % 60) + "分" + pad(seconds % 60) + "秒";
    }
    function showRun(runId) {
      const run = current().runs.find(item => item.runId === runId);
      if (run) {
        run.expanded = true;
        refresh();
        document.querySelector('[data-run="' + runId + '"]')?.scrollIntoView({ behavior: "smooth", block: "center" });
      }
    }
    function renderMessages(forceBottom) {
      const scroller = $("#chatScroll");
      const wasBottom = scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight < 80;
      const oldTop = scroller.scrollTop;
      const list = $("#messageList");
      list.replaceChildren();
      const runs = current().runs.filter(run => run.startedAt !== null || terminal(run));
      if (!runs.length) {
        const welcome = element("div", "welcome-state");
        welcome.append(element("h2", "", "今天有什么可以帮你？"), element("p", "", "发送消息开始。处理期间可以继续补充，消息将依次执行。"));
        list.append(welcome);
      }
      for (const run of runs) {
        const turn = element("section", "turn");
        turn.dataset.run = run.runId;
        const user = element("div", "user-message");
        user.append(element("div", "user-bubble", run.prompt));
        turn.append(user);
        const assistant = element("div", "assistant-content");
        const clock = element("div", "processing-time");
        clock.dataset.clockRun = run.runId;
        assistant.append(clock);
        const process = element("details", "run-process");
        const running = run.status === "running";
        process.open = running || run.expanded === true;
        const summary = element("summary", "process-summary");
        summary.append(element("span", running ? "status-dot active" : "status-dot"),
          element("span", "", running ? currentActivity(run) : !run.startedAt ? "已取消排队" : statusNames[run.status]),
          element("span", "process-count", run.events.filter(event => event.payload.displayName).length + " 个事件"),
          element("span", "chevron", "›"));
        summary.addEventListener("click", event => {
          // 运行期间始终展示节点；终态后允许回看，下一轮不会影响上一轮展开状态。
          if (run.status === "running") event.preventDefault();
        });
        process.addEventListener("toggle", () => {
          if (process.isConnected && terminal(run)) { run.expanded = process.open; save(); }
        });
        process.append(summary);
        const timeline = element("div", "inline-timeline");
        for (const event of run.events.filter(event => event.payload.displayName)) {
          const row = element("details", "timeline-node");
          const line = element("summary", "node-summary");
          line.append(element("span", "node-dot"), element("span", "node-label", title(event)), element("time", "node-time", time(event.occurredAt)));
          row.append(line, element("pre", "event-json", JSON.stringify(event, null, 2)));
          timeline.append(row);
        }
        process.append(timeline);
        assistant.append(process);
        // 回答增量仍按公共事件保存；本原型在终态后才呈现正文。
        if (terminal(run)) {
          if (run.answer) assistant.append(element("div", "assistant-text", run.answer));
          if (run.status === "cancelled" || run.status === "failed") {
            assistant.append(element("div", "terminal-note " + run.status,
              run.status === "failed" ? "本次处理超时，已保留收到的内容。" : run.startedAt ? "已停止，已生成的内容仍保留。" : "消息已取消，未开始执行。"));
            if (run.status === "failed") assistant.append(button("重新排队", "retry-button", () => {
              enqueue(current(), run.prompt); save(); refresh(true); announce("已重新加入队列。");
            }));
          }
          if (run.artifact) {
            const file = element("div", "file-chip");
            file.append(element("span", "file-icon", "PDF"), element("span", "", run.artifact.name), element("small", "", run.artifact.displayName + " · 示例文件"));
            assistant.append(file);
          }
        }
        turn.append(assistant);
        list.append(turn);
      }
      scroller.scrollTop = forceBottom || wasBottom ? scroller.scrollHeight : oldTop;
    }
    function renderQueue() {
      const session = current();
      const list = $("#queueItems");
      list.replaceChildren();
      $("#queueEmpty").hidden = session.queue.length !== 0;
      for (const [index, id] of session.queue.entries()) {
        const run = session.runs.find(item => item.runId === id);
        const row = element("div", "queue-item");
        row.append(element("span", "queue-position", pad(index + 1)));
        const content = element("div", "queue-content");
        content.append(button(run.prompt, "queue-prompt", () => showRun(id)));
        const meta = element("div", "queue-meta");
        meta.append(element("span", "queue-state", index ? "等待中" : "下一条"),
          element("span", "", "·"), element("span", "queue-wait", duration(Date.now() - run.submittedAt)),
          element("span", "", "已排队"));
        meta.dataset.queueRun = id;
        content.append(meta);
        const remove = button("", "remove-queue", () => cancelQueued(id));
        remove.setAttribute("aria-label", "取消队列第 " + (index + 1) + " 条消息");
        remove.title = "取消排队";
        remove.innerHTML = '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="m4 4 8 8m0-8-8 8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>';
        row.append(content, remove);
        list.append(row);
      }
    }
    function title(event) {
      const payload = event.payload;
      if (event.type === "message.delta") return "收到回答片段";
      if (event.type.startsWith("tool.")) return payload.displayName + " · " +
        (event.type === "tool.finished" ? payload.isError ? "失败" : "已完成" : "处理中");
      return payload.displayName;
    }
    function renderSessions() {
      const select = $("#sessionSelect");
      select.replaceChildren();
      store.sessions.slice().reverse().forEach(session => {
        const option = element("option", "", session.title + (session.activeId ? " · 运行中" : ""));
        option.value = session.id;
        select.append(option);
      });
      select.value = store.currentId;
    }
    function refresh(bottom = false) {
      renderSessions();
      renderMessages(bottom);
      renderQueue();
      updateClocks();
    }
    function updateClocks() {
      const session = current();
      const running = active(session);
      const now = Date.now();
      $("#queueSection").hidden = session.queue.length === 0;
      setText("#queueBadge", String(session.queue.length));
      $("#stopRunButton").hidden = !running;
      $("#sendButton").setAttribute("aria-label", running ? "加入队列" : "发送");
      $("#sendButton").disabled = !$("#messageInput").value.trim();
      setText("#composerNote", running ? session.queue.length + " 条排队 · 当前处理结束后依次发送" : "Enter 发送 · Shift + Enter 换行");
      $("#messageInput").placeholder = running ? "继续补充，消息将加入队列…" : "发送消息…";
      document.querySelectorAll("[data-clock-run]").forEach(node => {
        const run = session.runs.find(item => item.runId === node.dataset.clockRun);
        node.textContent = run.startedAt ? "已处理 " + humanDuration((run.endedAt || now) - run.startedAt) :
          "已等待 " + humanDuration((run.endedAt || now) - run.submittedAt);
      });
      document.querySelectorAll("[data-queue-run]").forEach(node => {
        const run = session.runs.find(item => item.runId === node.dataset.queueRun);
        node.querySelector(".queue-wait").textContent = duration(now - run.submittedAt);
      });
    }
    $("#composerForm").addEventListener("submit", event => {
      event.preventDefault();
      const input = $("#messageInput");
      const prompt = input.value.trim();
      if (!prompt || composing) return;
      enqueue(current(), prompt);
      input.value = "";
      save(); refresh(true);
      announce(active(current()) ? "消息已提交，同一会话按顺序执行。" : "消息已发送。");
    });
    $("#messageInput").addEventListener("input", updateClocks);
    $("#messageInput").addEventListener("compositionstart", () => { composing = true; });
    $("#messageInput").addEventListener("compositionend", () => { composing = false; });
    $("#messageInput").addEventListener("keydown", event => {
      if (event.key === "Enter" && !event.shiftKey && !event.isComposing && !composing && event.keyCode !== 229) {
        event.preventDefault(); $("#composerForm").requestSubmit();
      }
    });
    $("#stopRunButton").addEventListener("click", () => {
      const run = active(current());
      if (!run) return;
      finish(current(), run, "cancelled");
      refresh();
      announce("当前运行已停止，下一条排队消息继续执行。");
    });
    $("#sessionSelect").addEventListener("change", event => {
      store.currentId = event.target.value; save(); refresh(true);
    });
    $("#newChatButton").addEventListener("click", () => {
      newSession("新对话"); save(); refresh(true); $("#messageInput").focus();
    });
    $("#demoControl").addEventListener("change", event => {
      const action = event.target.value;
      event.target.value = "";
      if (action === "reset") { seedDemo(); announce("已重置本地演示记录。"); return; }
      const run = active(current());
      if (!run) { announce("当前没有正在运行的消息。"); return; }
      if (action === "complete") {
        const now = Date.now();
        // 快速演示只缩短尚未发生步骤的等待，不改写已记录的时间戳。
        const script = steps(run);
        while (run.cursor < script.length) {
          const [, type, payload] = script[run.cursor++];
          append(run, type, payload, now);
        }
        finish(current(), run, "completed", now);
      }
      if (action === "fail") finish(current(), run, "failed");
      refresh();
    });
    if (!restore()) seedDemo(); else refresh(true);
    window.setInterval(tick, 250);
  </script>
</body>
</html>
