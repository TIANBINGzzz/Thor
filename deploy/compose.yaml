name: ccsdkscribe
services:
  runtime:
    image: ${CCSDK_IMAGE:?Set the full image reference with a release tag or digest}
    init: true
    restart: unless-stopped
    env_file:
      - path: ${CCSDK_ENV_FILE:-/etc/ccsdkscribe/runtime.env}
        format: raw
    environment:
      HOME: /home/scribe
      CLAUDE_CONFIG_DIR: /app/.scribe-runs/claude-config
      SCRIBE_RUN_DB: /app/.scribe-runs/runs.sqlite3
    ports:
      - "${CCSDK_BIND_IP:-127.0.0.1}:4310:4310"
    volumes:
      - runtime-data:/app/.scribe-runs
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s
    mem_limit: ${CCSDK_MEMORY_LIMIT:-4g}
    cpus: ${CCSDK_CPU_LIMIT:-2.0}
    pids_limit: 512
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  runtime-data:
    name: ccsdkscribe-runtime-data
