# Flow fragment: replace only stages after selecting the real Codeup repository.
# Keep the sources and defaultWorkspace generated by Flow for that repository.
stages:
  build_stage:
    name: 构建测试并打包
    jobs:
      build_job:
        name: Linux镜像制品
        runsOn:
          group: public/cn-beijing
          container: build-steps-public-registry.cn-beijing.cr.aliyuncs.com/build-steps/alinux3:latest
          instanceType: LARGE_4C8G
        enableDockerDaemon: true
        timeoutMinutes: 40
        steps:
          build_step:
            step: Command
            name: Docker构建和测试
            with:
              run: |
                set -eu
                if [ ! -f Dockerfile ] || [ ! -f deploy/build.sh ]; then
                  echo 'Missing project files: select the CCSDKScribe Codeup source and its defaultWorkspace.' >&2
                  exit 1
                fi
                : "${BUILD_NUMBER:?Flow BUILD_NUMBER is missing}"
                commit_sha=$(git rev-parse --verify HEAD)
                export CCSDK_IMAGE="ccsdkscribe:${commit_sha}-${BUILD_NUMBER}"
                export CCSDK_OUTPUT_DIRECTORY="dist/release-${BUILD_NUMBER}"
                sh deploy/build.sh
          upload_step:
            step: ArtifactUpload
            name: 上传镜像部署包
            with:
              uploadType: flowPublic
              artifact: ccsdkscribe_release
              filePath:
                - dist/release-${BUILD_NUMBER}/
              includePathInArtifact: false
