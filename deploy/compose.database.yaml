services:
  runtime:
    volumes:
      - type: bind
        source: ${CCSDK_DATABASE_ENV_FILE:-${CCSDK_CONFIG_DIRECTORY:?Set a persistent host configuration directory}/database-qa.env}
        # Container path owned by the writing/runtime image, not the host.
        target: /app/.claude/workflows/database-qa/workflow.env
        read_only: true
        bind:
          create_host_path: false
