services:
  runtime:
    volumes:
      - type: bind
        source: ${CCSDK_DATA_DIRECTORY:-${CCSDK_CONFIG_DIRECTORY:?Set a persistent host configuration directory}/data}
        # Container scope: source.json resolves private/connection.json here.
        target: /app/.claude/databases/schoolDoubleHigh/private
        read_only: true
        bind:
          create_host_path: false
