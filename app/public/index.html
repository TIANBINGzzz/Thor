<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="scribe-token" content="__SCRIBE_TOKEN__" />
    <title>CCSDKScribe</title>
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <header class="bar">
      <div class="bar-left">
        <strong>CCSDKScribe</strong>
        <span id="model" class="tag">连接中…</span>
        <span id="caps" class="muted"></span>
      </div>
      <div class="bar-right">
        <span id="session" class="muted mono"></span>
        <label class="toggle">
          <input id="show-thinking" type="checkbox" />
          显示思考过程
        </label>
        <button id="reset" type="button" class="ghost">新会话</button>
      </div>
    </header>

    <main id="stream" class="stream" aria-live="polite">
      <div class="empty">
        <p>直接提问，或用下面的示例试试撰写能力。</p>
        <div class="samples">
          <button type="button" data-prompt="/report 为管理层撰写本项目技术能力与上线风险报告">
            /report 技术能力与上线风险
          </button>
          <button type="button" data-prompt="用 report-writing 的标准，写一份 CCSDKScribe 前端接入方案的评审报告，区分事实、推断和未知项">
            前端接入方案评审报告
          </button>
          <button type="button" data-prompt="这个项目现在具备哪些能力？读代码后回答，不要猜。">
            读代码后说明项目能力
          </button>
        </div>
      </div>
    </main>

    <form id="composer" class="composer">
      <div class="composer-inner">
        <div
          id="picker"
          class="picker"
          role="listbox"
          aria-label="引用候选"
          hidden
        >
          <div class="picker-head">
            <div id="picker-sources" class="picker-sources"></div>
            <span id="picker-count" class="picker-count"></span>
          </div>
          <ul id="picker-list" class="picker-list"></ul>
          <div class="picker-foot">
            <kbd>↑</kbd><kbd>↓</kbd> 选择 · <kbd>Enter</kbd> 插入 ·
            <kbd>Tab</kbd> 换数据源 · <kbd>Esc</kbd> 关闭
          </div>
        </div>
        <div id="ref-row" class="ref-row" aria-live="polite"></div>
        <textarea
          id="input"
          rows="3"
          placeholder="输入问题，@ 引用文件或依赖，Enter 发送，Shift+Enter 换行"
          autofocus
        ></textarea>
        <div class="upload-row">
          <label class="upload-button ghost">
            <input id="file-input" type="file" multiple />
            添加文件
          </label>
          <span id="file-status" class="muted">本会话文件</span>
          <div id="file-list" class="file-list" aria-live="polite"></div>
        </div>
        <div class="actions">
          <span id="status" class="muted"></span>
          <button id="stop" type="button" class="ghost" hidden>停止</button>
          <select id="model-select" class="model-select" aria-label="选择模型" disabled>
            <option>连接中…</option>
          </select>
          <button id="send" type="submit">发送</button>
        </div>
      </div>
    </form>

    <script type="module" src="/app.js"></script>
  </body>
</html>
